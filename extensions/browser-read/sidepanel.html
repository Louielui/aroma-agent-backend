<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香香 · 網頁對話</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header><strong>香香 · Imagine</strong><button id="new-chat" type="button">新對話</button></header>
<main><div id="welcome"><h1>讓香香幫你查資料</h1><p>說出你要完成的唯讀查詢，或加入網頁一起看。</p><p class="note">任務模式不讀取網頁。需要解讀網頁時，先按 Chrome 工具列的香香圖示授權目前分頁。</p></div><div id="messages" aria-live="polite"></div><article id="answer" hidden><p id="evidence" class="note"></p><div id="text"></div><details id="read-evidence" hidden><summary>來源與模型</summary><p id="read-evidence-text" class="note"></p></details></article></main>
<footer><p id="status" role="status" aria-live="polite"></p><form id="composer"><label class="sr-only" for="coverage-mode">讀取範圍</label><select id="coverage-mode"><option value="task_only">任務</option><option value="main_frame_visible_text">目前網頁</option><option value="selection_text">選取文字</option></select><span id="context-chip" class="note">任務 · 不讀取網頁</span><label class="sr-only" for="question">傳訊息給香香</label><textarea id="question" maxlength="1000" rows="2" placeholder="傳訊息給香香，或接着追問…"></textarea><div class="actions"><span class="note">唯讀查詢 · 圖片未讀取</span><button id="recover" type="button" hidden>查看已保存狀態</button><button id="cancel" type="button" hidden>停止</button><button id="prepare" type="submit">傳送 ↑</button></div></form></footer>
<section id="preview" hidden aria-labelledby="preview-title"><div class="preview-card"><h2 id="preview-title">確認交給香香的內容</h2><p id="source"></p><p id="model"></p><p id="coverage"></p><p id="task-scope"></p><details><summary>查看文字預覽</summary><pre id="excerpt"></pre></details><details id="history-details" hidden><summary>查看會外送的先前對話</summary><pre id="history-preview"></pre></details><label><input id="consent" type="checkbox">我同意上述唯讀查詢範圍，以及將這次文字、顯示的對話與查詢結果交給所選 AI 訂閱模型。回答保留在本機；原始網頁文字不保存。</label><div class="actions"><button id="dismiss" type="button">返回編輯</button><button id="read" type="button" disabled>確認並傳送</button></div></div></section>
<script src="sidepanel.js"></script></body></html>
