<!doctype html><html lang="/*LOCALE*/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Action Gateway</title>
<style>body{font:16px/1.6 system-ui;color:#28332e;background:#f7f7f4;margin:0}main{max-width:900px;margin:40px auto;padding:24px}a{color:#405b4a}article{background:white;border:1px solid #dedfd8;border-radius:14px;padding:24px;margin:18px 0}button{font:inherit;border:1px solid #c5cbc6;border-radius:8px;padding:9px 16px;background:white;margin:8px 8px 0 0;cursor:pointer}button.primary{background:#405b4a;color:white}button:disabled{opacity:.5;cursor:wait}.meta{color:#68726b}#activity[aria-busy=true]{animation:pulse 1.3s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){#activity{animation:none!important}}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace}</style>
<main><a href="/demo">Xiangxiang</a> · <a href="/architecture">Architecture</a><h1 id="title"></h1><p id="intro"></p><button id="inspect"></button><p id="activity" role="status" aria-live="polite"></p><section id="content"></section><h2 id="history"></h2><section id="runs"></section></main>
<script>
const L=/*LABELS*/,el=id=>document.getElementById(id);let working=false
for(const k of ['title','intro','inspect','history'])el(k).textContent=L[k]
function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
function button(text,fn){const b=node('button',text);b.onclick=()=>run(fn);return b}
async function request(body){const r=await fetch('/api/v1/scheduler-actions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),v=await r.json();if(!r.ok||v.error)throw Error(L.failure);return v}
async function run(fn){if(working)return;working=true;el('activity').textContent=L.busy;el('activity').setAttribute('aria-busy','true');document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();el('activity').textContent=''}catch(_){el('activity').textContent=L.failure}finally{working=false;el('activity').setAttribute('aria-busy','false');document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function proposal(r){const a=node('article','');a.append(node('h2',r.target.taskPath+r.target.taskName),node('p',r.capability==='scheduler.pause'?L.pause:L.resume),node('p',L.impact),node('p',L.rollback),node('p',L.pending));a.append(button(L.approve,async()=>{if(!window.confirm(L.confirm+'\n'+r.target.taskPath+r.target.taskName))return;const v=await request({op:'approve',id:r.id,hash:r.hash,nonce:r.nonce});showResult(v.run);await history()}));el('content').replaceChildren(a)}
function showResult(r){const a=node('article','');a.append(node('h2',r.target.taskPath+r.target.taskName),node('p',r.state==='verified'?L.verified:L.failure));if(r.before)a.append(node('p',(r.before.enabled?L.enabled:L.disabled)+' → '+(r.after?(r.after.enabled?L.enabled:L.disabled):L.unavailable)));if(r.state==='verified')a.append(button(L.restore,async()=>proposal((await request({op:'restore',id:r.id})).run)));const d=node('details','');d.append(node('summary',L.evidence),node('pre',JSON.stringify(r.timeline,null,2)));a.append(d);el('content').replaceChildren(a)}
async function history(){const v=await(await fetch('/api/v1/scheduler-actions')).json();if(v.error)throw Error(L.failure);el('runs').replaceChildren();for(const r of v.runs.slice().reverse().slice(0,20)){if(!r.target)continue;const a=node('article','');a.append(node('h3',r.target.taskName),node('p',r.state==='verified'?L.verified:r.state==='awaiting_approval'?L.pending:L.failure));a.append(button(L.evidence,async()=>showResult((await request({op:'get',id:r.id})).run)));el('runs').append(a)}}
el('inspect').onclick=()=>run(async()=>{const {inspection:i}=await request({op:'inspect'});el('content').replaceChildren(node('p',L.unknown));for(const o of i.observations){const a=node('article','');a.append(node('h2',o.target.taskPath+o.target.taskName),node('p',o.state==='CONFIRMED'?(o.snapshot.enabled?L.enabled:L.disabled):L.unavailable));if(o.state==='CONFIRMED'&&['Ready','Disabled'].includes(o.snapshot.runtime))a.append(button(o.snapshot.enabled?L.pause:L.resume,async()=>proposal((await request({op:'prepare',inspectionId:i.id,targetId:o.target.id,action:o.snapshot.enabled?'scheduler.pause':'scheduler.resume'})).run)));el('content').append(a)}await history()});run(history)
</script></html>
