<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiangxiang</title>
<link rel="icon" type="image/svg+xml" href="/*FAVICON_URI*/">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Xiangxiang">
<style>/*INLINE_CSS*/</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top">
        <span class="side-brand-dot" aria-hidden="true"></span>
        <span class="brand" id="brand-name"></span>
        <button id="collapse" class="icon-btn" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v16H4z M9 4v16"/></svg></button>
      </div>
      <!-- ⛔ DESTINATIONS, ABOVE AND SEPARATE FROM THE CONVERSATION LIST.
           Sitting between 開新對話 and the list, 首頁 read as another conversation — which is
           what it is not. It is a place, like Claude's Home. 營運 / 財務 / 行政 stay in
           PRODUCT-IA and OFF this nav until each has something conversation does badly,
           asserted by src/demo/sidebar.test.js. -->
      <nav id="places" class="places">
        <button id="open-home" class="place-btn" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7 M5 9v12h14V9 M9 21v-8h6v8"/></svg><span id="home-label"></span>
        </button>
      </nav>
      <button id="new-chat" class="new-chat" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7 M10 14l1-4L19 2l3 3-8 8z"/></svg><span id="new-chat-label"></span></button>
      <div class="side-search">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6"/></svg>
        <input id="conversation-search" type="search" autocomplete="off" spellcheck="false">
      </div>
      <details class="side-workspace" open>
        <summary id="workspace-label"></summary>
        <nav id="workspace-nav">
          <button id="open-manager" class="side-item" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v16H4z M8 8h8 M8 12h8 M8 16h4"/></svg><span id="manager-label"></span></button>
          <button id="open-memory" class="side-item" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 4H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h2 M16 4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2 M9 7h6v10H9z M12 3v4 M12 17v4"/></svg><span id="memory-label"></span></button>
          <button id="open-connections" class="side-item" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71 M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span id="connections-label"></span></button>
          <button id="open-workers" class="side-item" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 7-5 5 5 5 M16 7l5 5-5 5 M14 4l-4 16"/></svg><span id="workers-label"></span></button>
        </nav>
      </details>
      <div class="side-history-heading"><span id="history-label"></span><span id="history-count"></span></div>
      <nav id="convs" class="convs"></nav>
      <div class="side-bottom">
      <button id="open-architecture" class="side-item" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 3h6v5H9z M3 16h6v5H3z M15 16h6v5h-6z M12 8v4 M6 16v-4h12v4"/></svg><span id="architecture-label"></span></button>
      <button id="open-settings" class="side-item" type="button" aria-haspopup="dialog" aria-expanded="false">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16 M4 17h16 M8 4v6 M16 14v6"/></svg><span id="settings-label"></span>
      </button>
      <div class="side-foot">
        <span class="dot" id="conn-dot" aria-hidden="true"></span>
        <span id="conn-text"></span>
      </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="expand" class="icon-btn hidden" type="button">☰</button>
        <span class="brand-mark" aria-hidden="true">/*INLINE_DOT*/</span>
        <h1 id="conv-title"></h1>
      </header>

      <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div id="composer">
        <div class="composer-col">
          <!-- ⛔ 附上咗乜要睇得見 — ABOVE the textarea, so what would travel is read BEFORE
               anything is typed. Filled from the server's own preview, never composed here. -->
          <div id="attach-preview" class="attach-preview hidden" aria-live="polite"></div>
          <div id="composer-box">
            <textarea id="msg" rows="1"></textarea>
            <div class="composer-bar">
              <div id="plus-wrap">
                <button id="plus" type="button" aria-haspopup="menu" aria-expanded="false">＋</button>
                <div id="plus-menu" class="hidden" role="menu"></div>
              </div>
              <span id="lane-hint" class="lane-hint"></span>
              <div class="bar-right">
                <select id="chat-level" class="hidden">
                  <option id="chat-level-fast" value="fast"></option>
                  <option id="chat-level-standard" value="standard"></option>
                  <option id="chat-level-deep" value="deep"></option>
                </select>
                <div id="picker-wrap">
                  <button id="picker" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="picker-label"></span><span class="caret">▾</span>
                  </button>
                  <div id="picker-menu" class="hidden" role="listbox"></div>
                </div>
                <button id="send" type="button">↑</button>
              </div>
            </div>
          </div>
          <p class="composer-note" id="composer-note"></p>
        </div>
      </div>
    </main>
  </div>

  <!-- SETTINGS OVERLAY. Real markup, hidden until asked for — the page is forbidden to
       assemble markup from strings, so the shell lives here and only the switch rows (which
       are data-driven) are built with createElement + textContent in app.js.
       Same window, same session: opening it does not leave the conversation. -->
  <div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="overlay-backdrop" id="settings-backdrop"></div>
    <div class="sheet" role="document">
      <div class="sheet-head">
        <h2 id="settings-title"></h2>
        <button id="close-settings" class="icon-btn" type="button">✕</button>
      </div>

      <div class="sheet-body">
        <section class="set-sec">
          <h3 id="set-style-h"></h3>
          <p class="set-hint" id="set-style-hint"></p>
          <textarea id="set-style" rows="4"></textarea>
          <div class="set-count"><span id="set-style-n">0</span> / <span id="set-style-cap">—</span></div>
        </section>

        <section class="set-sec">
          <h3 id="set-prefs-h"></h3>
          <p class="set-hint" id="set-prefs-hint"></p>
          <textarea id="set-prefs" rows="6"></textarea>
          <div class="set-count"><span id="set-prefs-n">0</span> / <span id="set-prefs-cap">—</span></div>
        </section>

        <section class="set-sec">
          <h3 id="set-mem-h"></h3>
          <p class="set-hint" id="set-mem-hint"></p>
          <div id="set-flags"></div>
        </section>

        <p class="set-foot" id="set-foot"></p>
      </div>

      <div class="sheet-foot">
        <button id="save-settings" class="set-save" type="button"></button>
        <span class="set-msg" id="set-msg"></span>
      </div>
    </div>
  </div>

  <!-- The chat avatar. It lives here as real markup and is cloned per turn: the page is
       forbidden to build markup from strings, and createElementNS would need the SVG
       namespace URL as a literal. cloneNode needs neither. -->
  <template id="tpl-avatar">/*INLINE_DOT*/</template>

<!-- ⛔ ONE inline script, and the i18n goes INSIDE it, not beside it.
     A second script element broke the 「exactly one inline script」 invariant that keeps this a
     single auditable same-origin document. And writing that tag name out in full HERE broke the
     count a second time — the checker counts occurrences in the whole page, comment included.
     Third form of the same thing today: documentation that trips the guard it explains.
     So this comment does NOT spell out the placeholder token either — a page that still
     contains the token reads as a placeholder that was never replaced.
     The first block is the resolver + catalogue (generated from src/i18n/browserResolver.js);
     it precedes the app so the IIFE closes over createResolver and CATALOGUE. -->
<script>/*INLINE_I18N*/
/*INLINE_JS*/</script>
</body>
</html>
