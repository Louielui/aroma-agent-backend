<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>守燈</title>
<link rel="icon" type="image/svg+xml" href="/*FAVICON_URI*/">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="守燈">
<style>/*INLINE_CSS*/</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="對話列表">
      <div class="side-top">
        <button id="collapse" class="icon-btn" type="button" aria-label="收合側欄" title="收合側欄">☰</button>
        <span class="brand">守燈</span>
      </div>
      <button id="new-chat" class="new-chat" type="button">＋ 開新對話</button>
      <nav id="convs" class="convs" aria-label="歷史對話"></nav>
      <div class="side-foot">
        <span class="dot" id="conn-dot" aria-hidden="true"></span>
        <span id="conn-text">本機 · 127.0.0.1</span>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="expand" class="icon-btn hidden" type="button" aria-label="展開側欄" title="展開側欄">☰</button>
        <span class="brand-mark" aria-hidden="true">/*INLINE_LANTERN*/</span>
        <h1 id="conv-title">守燈</h1>
      </header>

      <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>

      <div id="composer">
        <div class="composer-col">
          <div id="composer-box">
            <textarea id="msg" rows="1" placeholder="同守燈講嘢…" aria-label="訊息"></textarea>
            <div class="composer-bar">
              <div id="plus-wrap">
                <button id="plus" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="更多" title="更多">＋</button>
                <div id="plus-menu" class="hidden" role="menu" aria-label="捷徑"></div>
              </div>
              <span id="lane-hint" class="lane-hint"></span>
              <div class="bar-right">
                <div id="picker-wrap">
                  <button id="picker" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="picker-label">守燈（Claude）</span><span class="caret">▾</span>
                  </button>
                  <div id="picker-menu" class="hidden" role="listbox" aria-label="揀邊個守燈"></div>
                </div>
                <button id="send" type="button" aria-label="送出">↑</button>
              </div>
            </div>
          </div>
          <p class="composer-note">本機示範 · 守燈唔會自行執行任何嘢，所有動作都要你批准</p>
        </div>
      </div>
    </main>
  </div>

  <!-- The chat avatar. It lives here as real markup and is cloned per turn: the page is
       forbidden to build markup from strings, and createElementNS would need the SVG
       namespace URL as a literal. cloneNode needs neither. -->
  <template id="tpl-avatar">/*INLINE_LANTERN_SMALL*/</template>

<script>/*INLINE_JS*/</script>
</body>
</html>
