<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xiangxiang — Settings</title>
<link rel="icon" href="__ICON__">
<style>__CSS__</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="page-h"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <section>
    <h2 id="style-h"></h2>
    <p class="hint" id="style-hint"></p>
    <textarea id="style" rows="5"></textarea>
    <div class="count"><span id="styleCount">0</span> / <span id="styleCap">—</span></div>
  </section>

  <section>
    <h2 id="prefs-h"></h2>
    <p class="hint" id="prefs-hint"></p>
    <textarea id="prefs" rows="8"></textarea>
    <div class="count"><span id="prefsCount">0</span> / <span id="prefsCap">—</span></div>
  </section>

  <section>
    <h2 id="mem-h"></h2>
    <p class="hint" id="mem-hint"></p>
    <div id="flags"></div>
  </section>

  <div class="bar">
    <button class="cta" id="save"></button>
    <span class="msg" id="msg"></span>
  </div>

  <p class="foot" id="foot"></p>
</div>
<script>__I18N__
__JS__</script>
</body>
</html>
