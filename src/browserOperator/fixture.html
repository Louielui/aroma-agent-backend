<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imagine browser operator fixture</title><style>body{font:20px system-ui;margin:60px;color:#173c32}button,input{font:inherit;padding:20px;margin:20px}#fixture_button{display:block}section{height:900px}pre{white-space:pre-wrap}</style></head><body><h1>Imagine browser operator fixture</h1><p>Owned synthetic page. No external requests, business records, login or form submission.</p><button id="fixture_button">Fixture button</button><label>Fixture input <input id="fixture_input" aria-label="Fixture input" autocomplete="off" maxlength="120"></label><pre id="events">No input measured.</pre><section><h2>Scroll target</h2><p>This space tests real scrolling.</p></section><p>Fixture end</p><script>
const measured={moves:0,clicks:0,inputs:0,enters:0,scrolls:0,untrusted:0};
const show=()=>document.getElementById('events').textContent=JSON.stringify(measured);
const record=(key,e)=>{if(e.isTrusted)measured[key]++;else measured.untrusted++;show()};
document.addEventListener('mousemove',e=>record('moves',e));document.getElementById('fixture_button').addEventListener('click',e=>record('clicks',e));document.getElementById('fixture_input').addEventListener('input',e=>record('inputs',e));document.getElementById('fixture_input').addEventListener('keydown',e=>{if(e.key==='Enter')record('enters',e)});document.addEventListener('wheel',e=>record('scrolls',e));
</script></body></html>
