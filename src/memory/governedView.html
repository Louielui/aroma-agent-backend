<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;background:#faf9f7;color:#292724}main{max-width:1180px;margin:auto;padding:28px}nav{display:flex;gap:20px}a{color:#76532d}h1{font-size:30px;margin-bottom:6px}h2{font-size:18px}.layers{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:24px 0}.layer,article,.panel{background:white;border:1px solid #e4ded4;border-radius:12px;padding:18px}.layer strong{display:block;font-size:25px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button,input,select,textarea{font:inherit;border:1px solid #d9d1c6;border-radius:7px;padding:8px;background:white;color:inherit}button{cursor:pointer;margin:4px 6px 4px 0}button.primary{background:#735338;color:white}button:disabled{opacity:.5;cursor:wait}textarea{width:100%;min-height:100px}label{display:block;margin:10px 0 4px}form{margin:15px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.row>label{flex:1}label input,label select{width:100%}article{margin:12px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:13px;color:#6d665c}.badge{background:#f0ebe1;border-radius:5px;padding:3px 8px;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;font-size:12px}#notice{position:sticky;top:0;background:#eee5d6;padding:10px;border-radius:8px;z-index:1}summary{cursor:pointer;font-weight:600}.panel{margin:14px 0}#grant-scopes{height:170px;width:100%}#records{margin-top:20px}@media(max-width:800px){.layers{grid-template-columns:repeat(2,1fr)}main{padding:16px}}
</style>
<main><nav style="flex-wrap:wrap"><a href="/demo" data-l="back"></a><a href="/architecture" data-l="architecture"></a><a href="/memory/legacy" data-l="legacy"></a><a href="/company-access#mail-memory" data-l="mailMemory"></a></nav>
<h1 data-l="title"></h1><p data-l="intro"></p><p id="notice" role="status"></p><div id="layers" class="layers"></div><p id="health" class="meta"></p><details class="panel"><summary data-l="backup"></summary><button id="backup" data-l="backup"></button><pre id="backup-result"></pre></details>
<section class="panel" aria-labelledby="operations-title"><h2 id="operations-title" data-l="operations"></h2><p data-l="operationsHelp"></p><div id="operations-status" role="status"></div><button id="operations-refresh" data-l="refresh"></button><a href="/company-access#mail-memory" data-l="mailMemory"></a></section>
<section class="panel" aria-labelledby="consolidation-title"><h2 id="consolidation-title" data-l="consolidation"></h2><p data-l="consolidationHelp"></p><p id="consolidation-status" role="status"></p><button id="consolidation-toggle"></button><button id="review-suggestions" data-l="review"></button></section>
<form id="search"><div class="row"><label><span data-l="query"></span><input id="query" maxlength="2000" required></label></div><button data-l="search"></button><button type="button" id="reset" data-l="refresh"></button></form>
<details class="panel" id="editor"><summary data-l="propose"></summary><form id="proposal">
<div class="row"><label><span data-l="type"></span><select id="type"></select></label><label><span data-l="scope"></span><select id="scope"></select></label></div>
<label><span data-l="subject"></span><input id="subject" maxlength="240" required></label><label for="text" data-l="content"></label><textarea id="text" maxlength="30000" required></textarea>
<div class="row"><label><span data-l="link"></span><input id="source-link" type="url"></label><label><span data-l="version"></span><input id="source-version" maxlength="100"></label></div>
<p id="revision" class="meta"></p><button class="primary" data-l="propose"></button></form></details>
<details class="panel"><summary data-l="reflection"></summary><p data-l="evidence"></p><form id="reflect-form"><label><span data-l="subject"></span><input id="reflect-subject" maxlength="240" required></label><label><span data-l="query"></span><input id="reflect-query" maxlength="2000" required></label><button data-l="reflect"></button></form></details>
<details class="panel"><summary data-l="working"></summary><form id="work-form"><div class="row"><label><span data-l="goal"></span><input id="work-goal" required maxlength="2000"></label><label><span data-l="project"></span><input id="work-project" maxlength="200"></label></div><div class="row"><label><span data-l="worker"></span><input id="work-worker" maxlength="100"></label><label><span data-l="run"></span><input id="work-run" required maxlength="200"></label></div><button data-l="createWork"></button></form></details>
<details class="panel"><summary data-l="grants"></summary><p data-l="agent"></p><div id="agents"></div><form id="grant-form"><label><span data-l="agent"></span><input id="agent-id" pattern="[a-z][a-z0-9-]{1,60}" required></label><label for="grant-scopes" data-l="scope"></label><select id="grant-scopes" multiple required></select><button data-l="grant"></button></form><pre id="agent-token"></pre></details>
<div class="filters"><select id="filter-type"></select><select id="filter-status"></select><select id="filter-scope"></select><select id="filter-index"></select></div><p id="total" class="meta"></p><section id="records"></section><button id="more" data-l="more"></button></main>
<script>
'use strict';const L=/*LABELS*/;const el=id=>document.getElementById(id);document.title=L.title
for(const n of document.querySelectorAll('[data-l]'))n.textContent=L[n.dataset.l]
const types=['working','episodic','semantic','decision','procedural','preference'];const states=['temporary','candidate','active','superseded','archived','rejected','ignored']
let rows=[],supersedes=null,pending=false,total=0,consolidationEnabled=false,reviewOnly=false;const selected=new Set()
function option(node,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;node.append(o)}
for(const id of ['filter-type','filter-status','filter-scope'])option(el(id),'',L.all)
for(const key of ['type','status','scope'])el('filter-'+key).setAttribute('aria-label',L[key])
el('filter-index').setAttribute('aria-label',L.indexes);option(el('filter-index'),'',L.all);for(const state of ['pending','saved','raw_only','source_only','unconfirmed'])option(el('filter-index'),state,L[state])
for(const type of types){option(el('filter-type'),type,L[type]);if(type!=='working')option(el('type'),type,L[type])}
for(const state of states)option(el('filter-status'),state,L[state])
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(label,action){const b=node('button',label);b.type='button';b.onclick=action;return b}
async function loadOperations(){
 const area=el('operations-status');area.replaceChildren()
 try{
  const r=await fetch('/api/v1/memory/operations',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json()
  const labels={bridge:L.bridge,database:L.database,hindsight:L.hindsight}
  const state={ready:L.connected,unavailable:L.unavailable,degraded:L.degraded,foreign:L.foreign,disabled:L.paused,not_connected:L.unavailable,not_measured:L.notMeasured}
  for(const [key,value]of Object.entries(d.services||{}))area.append(node('p',(labels[key]||key)+' · '+(state[value.state]||L.unavailable)))
  area.append(node('p',L.receipts+' '+(d.receipts.pending??'—')+' · '+(d.receipts.enabled===true?L.automatic:d.receipts.enabled===false?L.paused:L.unavailable)))
  if(d.general.index)area.append(node('p',L.indexes+' · '+['saved','raw_only','source_only','pending','unconfirmed'].map(k=>L[k]+' '+d.general.index[k]).join(' · ')))
  else area.append(node('p',L.coverageUnavailable))
  if(d.general.counts)area.append(node('p',L.review+' '+d.general.counts.candidate))
  area.append(node('p',L.rebuildHelp),button(L.rebuild,()=>act({op:'rebuild_index'})))
  if(d.general.indexRebuild)area.append(node('p',L.rebuild+' · '+L.pending+' '+d.general.indexRebuild.pending+' · '+L.unconfirmed+' '+d.general.indexRebuild.unconfirmed))
  area.append(node('p',L.mailCoverage+' · '+(d.history.state==='completed'?L.historyComplete:d.history.state==='running'?L.historyRunning:d.history.state==='not_started'?L.historyNotStarted:L.unavailable)+(d.history.retained!==null&&d.history.retained!==undefined?' · '+L.saved+' '+d.history.retained:'')))
  const backupState={verified:L.backupVerified,running:L.backupRunning,failed:L.backupFailed,not_started:L.notMeasured,not_measured:L.notMeasured,unavailable:L.unavailable}
  area.append(node('h3',L.backupStatus),node('p',backupState[d.backup.state]||L.unavailable),node('p',L.backupHelp))
  if(d.backup.lastSucceededAt)area.append(node('p',L.completed+' · '+new Date(d.backup.lastSucceededAt).toLocaleString()))
  if(d.backup.nextAt)area.append(node('p',L.nextRetry+' · '+new Date(d.backup.nextAt).toLocaleString()))
  const detail=document.createElement('details');detail.append(node('summary',L.source),node('pre',JSON.stringify({checkedAt:d.checkedAt,mail:d.mail,history:d.history,backup:d.backup,rebuild:d.general.indexRebuild},null,2)));area.append(detail)
 }catch(_){area.append(node('p',L.coverageUnavailable))}
}
async function api(body){const r=await fetch('/api/v1/memory/catalog',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d.result}
async function act(body){if(pending)return;pending=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);el('notice').textContent=L.loading
try{const result=await api(body);await load();el('notice').textContent=L.done;return result}catch(e){el('notice').textContent=L.error+' · '+e.message}finally{pending=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function render(items){el('records').replaceChildren();if(!items.length)el('records').textContent=L.noResults
for(const r of items){const card=node('article');const head=node('div');head.append(node('span',L[r.type]||r.type,'badge'),node('span',L[r.status]||r.status,'badge'),node('span',r.scope,'meta'))
if(r.status==='active'){const box=document.createElement('input');box.type='checkbox';box.checked=selected.has(r.id);box.setAttribute('aria-label',L.evidence+' '+r.subject);box.onchange=()=>box.checked?selected.add(r.id):selected.delete(r.id);head.prepend(box)}
card.append(head,node('h2',r.subject),node('p',r.text),node('p',L.sourceDate+' · '+(r.source?.at||'—')+' · '+L.version+' '+r.version,'meta'),
node('p',L.indexes+' · '+(L[r.index?.state]||r.index?.state||'—')+' · '+r.id,'meta'))
if(r.details?.category){card.append(node('p',L[r.details.category]||r.details.category,'badge'),node('p',L.reason+' · '+r.details.reason),node('p',L.quote+' · '+r.details.quote))
if(r.details.taskState)card.append(node('p',L[r.details.taskState]||r.details.taskState))
if(r.details.replaces)card.append(node('p',L.replaces+' · '+r.details.replaces.text))
if(r.details.sourceId)card.append(button(L.original,async()=>{try{const res=await fetch('/api/v1/memory/catalog/'+encodeURIComponent(r.details.sourceId));if(!res.ok)throw Error();const d=await res.json();card.append(node('pre',JSON.stringify({text:d.record.text,source:d.record.source,status:d.record.status},null,2)))}catch(_){el('notice').textContent=L.error}}))}
if(r.source?.kind==='briefing_owner'&&/^[a-f0-9-]{36}$/.test(r.details?.runId||'')){const link=node('a',L.run);link.href='/manager?run='+encodeURIComponent(r.details.runId);card.append(link)}
if(r.type==='episodic'&&r.status==='active'&&r.scope==='private:owner'&&['owner_statement','measured_result'].includes(r.source?.attribution)&&r.text.length>=2&&r.text.length<=12000){const c=r.details?.consolidation;if(!c||c.state==='failed')card.append(button(L.consolidate,()=>act({op:'consolidate',id:r.id})));if(c)card.append(node('p',L.consolidation+' · '+({done:L.processed,empty:L.empty,failed:L.failed,running:L.loading}[c.state]||c.state)+(c.error?' · '+c.error:'')+(c.nextRetryAt?' · '+L.nextRetry+' '+c.nextRetryAt:''),'meta'))}
if(r.index?.nextRetryAt)card.append(node('p',L.nextRetry+' · '+r.index.nextRetryAt,'meta'))
const detail=document.createElement('details');detail.append(node('summary',L.source),node('pre',JSON.stringify({source:r.source,approval:r.approval,confidence:r.confidence,index:r.index,details:r.details,supersedes:r.supersedes,supersededBy:r.supersededBy},null,2)));card.append(detail)
if(r.status==='candidate'){card.append(button(L.approve,()=>{if(confirm(L.confirm))act({op:'transition',id:r.id,version:r.version,action:'approve'})}),button(L.reject,()=>act({op:'transition',id:r.id,version:r.version,action:'reject'})))}
if(['active','temporary','candidate'].includes(r.status))card.append(button(L.archive,()=>act({op:'transition',id:r.id,version:r.version,action:'archive'})))
if(r.status==='active'){card.append(button(L.index,()=>act({op:'index',id:r.id})),button(L.revise,()=>{supersedes=r.id;el('type').value=r.type;el('scope').value=r.scope;el('subject').value=r.subject;el('text').value=r.text;el('source-link').value=r.source.url||'';el('source-version').value=r.source.version||'';el('revision').textContent=L.revise+' '+r.id;el('editor').open=true;el('editor').scrollIntoView({behavior:'smooth'})}))
if(r.details?.mentalModel)card.append(button(L.reflect,()=>act({op:'reflect',request:{subject:r.subject,query:r.details.query,scope:r.scope,evidenceIds:r.details.evidenceVersions.map(e=>e.id),modelId:r.id}})))
if(r.type==='procedural')card.append(button(L.recordUsage,()=>{const runId=prompt(L.run);if(!runId)return;const outcome=prompt(L.outcome);if(!outcome)return;const exception=prompt(L.exception);act({op:'procedure',id:r.id,runId,outcome,exception})}))}
if(r.type==='working'&&r.status==='temporary')card.append(button(L.finish,()=>act({op:'finish',id:r.id,version:r.version,outcome:'completed'})))
card.append(button(L.audit,async()=>{try{const res=await fetch('/api/v1/memory/catalog/'+r.id);if(!res.ok)throw Error();const d=await res.json();const pre=node('pre',JSON.stringify(d.audit,null,2));card.append(pre)}catch(_){el('notice').textContent=L.error}}));el('records').append(card)}}
function filter(){render(rows.filter(r=>(!el('filter-type').value||r.type===el('filter-type').value)&&(!el('filter-status').value||r.status===el('filter-status').value)&&(!el('filter-scope').value||r.scope===el('filter-scope').value)&&(!el('filter-index').value||r.index.state===el('filter-index').value)))}
async function load(){await loadOperations();const res=await fetch('/api/v1/memory/catalog'+(reviewOnly?'?status=candidate':''),{cache:'no-store'});if(!res.ok)throw Error('memory_unavailable');const d=await res.json();rows=d.items;total=d.total;el('more').hidden=rows.length>=total;el('layers').replaceChildren();for(const r of d.status.layers){const n=node('div',L[r.type],'layer');n.append(node('strong',String(r.active)),node('small',L.totals+' '+r.total));el('layers').append(n)}
consolidationEnabled=d.consolidation?.enabled===true;el('consolidation-toggle').textContent=consolidationEnabled?L.pause:L.resume;el('consolidation-status').textContent=(consolidationEnabled&&d.consolidation?.captureEnabled&&d.status.consolidation.review<20?L.automatic:L.paused)+' · '+L.queued+' '+d.status.consolidation.pending+' · '+L.processed+' '+d.status.consolidation.done+' · '+L.empty+' '+d.status.consolidation.empty+' · '+L.failed+' '+d.status.consolidation.failed+' · '+L.candidate+' '+d.status.consolidation.review+(d.consolidation?.busy?' · '+L.loading:'')+(d.consolidation?.error?' · '+d.consolidation.error:'')
el('health').textContent='PostgreSQL · '+(d.status.database.state==='connected'?L.connected:L.unavailable)+' | pgvector · '+(d.status.database.vector?L.connected:L.unavailable)+' | '+['pending','unconfirmed','saved','raw_only','source_only','retrying'].map(k=>L[k]+' '+d.status.index[k]).join(' · ')+(d.runtime?.error?' | '+d.runtime.error:'')
el('total').textContent=L.totals+' '+d.total+' · '+L.loaded+' '+rows.length;if(!el('scope').options.length)for(const s of d.status.scopes){option(el('scope'),s,s);option(el('filter-scope'),s,s);if(s!=='private:owner')option(el('grant-scopes'),s,s)}if(!supersedes)el('scope').value='private:owner'
el('agents').replaceChildren();for(const a of d.status.agents){const line=node('p',a.id+' · '+(a.revoked?L.rejected:a.scopes.join(', ')));if(!a.revoked)line.append(button(L.revoke,()=>act({op:'grant',request:{id:a.id,scopes:[],writeScopes:[],revoked:true}})));el('agents').append(line)}for(const id of d.status.staleModels||[]){const r=rows.find(r=>r.id===id);if(r)r.details.stale=L.stale}filter()}
el('proposal').onsubmit=async e=>{e.preventDefault();const source={kind:'owner',id:'owner-ui-'+crypto.randomUUID(),at:new Date().toISOString(),attribution:'owner_statement'};if(el('source-link').value)source.url=el('source-link').value;if(el('source-version').value)source.version=el('source-version').value
const result=await act({op:'propose',record:{type:el('type').value,subject:el('subject').value,text:el('text').value,scope:el('scope').value,source,...(supersedes?{supersedes}:{})}});if(result){supersedes=null;el('proposal').reset();el('scope').value='private:owner';el('revision').textContent=''}}
el('search').onsubmit=async e=>{e.preventDefault();try{const results=await api({op:'recall',query:el('query').value,...(el('filter-scope').value?{scope:el('filter-scope').value}:{})});const matches=await Promise.all(results.map(async r=>{const cached=rows.find(x=>x.id===r.documentId);if(cached)return cached;const res=await fetch('/api/v1/memory/catalog/'+r.documentId);if(!res.ok)throw Error();return(await res.json()).record}));render(matches.filter(Boolean));el('notice').textContent=L.done}catch(_){el('notice').textContent=L.error}}
el('reflect-form').onsubmit=e=>{e.preventDefault();const evidence=rows.filter(r=>selected.has(r.id));if(!evidence.length||new Set(evidence.map(r=>r.scope)).size!==1){el('notice').textContent=L.evidence;return}act({op:'reflect',request:{subject:el('reflect-subject').value,query:el('reflect-query').value,scope:evidence[0].scope,evidenceIds:evidence.map(r=>r.id)}})}
el('work-form').onsubmit=e=>{e.preventDefault();act({op:'working',request:{subject:el('work-goal').value.slice(0,240),goal:el('work-goal').value,project:el('work-project').value,worker:el('work-worker').value,runId:el('work-run').value,context:[],ttlSeconds:86400,scope:el('scope').value}})}
el('grant-form').onsubmit=async e=>{e.preventDefault();const scopes=[...el('grant-scopes').selectedOptions].map(o=>o.value);const result=await act({op:'grant',request:{id:el('agent-id').value,scopes,writeScopes:scopes}});if(result)el('agent-token').textContent=result.token}
el('backup').onclick=async()=>{const r=await act({op:'backup'});if(r)el('backup-result').textContent=JSON.stringify(r,null,2)}
el('operations-refresh').onclick=loadOperations
el('consolidation-toggle').onclick=()=>act({op:'consolidationSettings',enabled:!consolidationEnabled})
el('review-suggestions').onclick=()=>{reviewOnly=true;for(const id of ['filter-type','filter-scope','filter-index'])el(id).value='';el('filter-status').value='candidate';load().catch(()=>el('notice').textContent=L.error)}
for(const id of ['filter-type','filter-status','filter-scope','filter-index'])el(id).onchange=filter
el('more').onclick=async()=>{try{const res=await fetch('/api/v1/memory/catalog?offset='+rows.length+(reviewOnly?'&status=candidate':''));if(!res.ok)throw Error();const d=await res.json();rows.push(...d.items);el('more').hidden=rows.length>=d.total;filter();el('total').textContent=L.totals+' '+rows.length+'/'+d.total}catch(_){el('notice').textContent=L.error}};el('reset').onclick=()=>{reviewOnly=false;el('filter-status').value='';load().catch(()=>el('notice').textContent=L.error)};el('notice').textContent=L.loading;load().then(async()=>{const id=new URLSearchParams(location.search).get('record');if(id){const res=await fetch('/api/v1/memory/catalog/'+encodeURIComponent(id));if(!res.ok)throw Error();const data=await res.json();if(!data.record)throw Error();render([data.record])}el('notice').textContent=L.done}).catch(()=>el('notice').textContent=L.error)
</script></html>
