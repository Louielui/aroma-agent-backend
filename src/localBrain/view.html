<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香香 · 本機測試話題</title>
<style>body{font:18px/1.65 system-ui;max-width:820px;margin:40px auto;padding:20px;background:#faf9f6;color:#222}textarea{width:100%;min-height:90px;font:inherit}button,select{font:inherit;padding:10px}article{white-space:pre-wrap;padding:20px;background:white;border-radius:12px;margin:20px 0}small{color:#555}pre{white-space:pre-wrap;overflow-wrap:anywhere}.sources{font-size:14px;overflow-wrap:anywhere;border-top:1px solid #ddd;margin-top:16px;padding-top:12px}</style>
<h1>香香 · 本機測試話題</h1><p><a href="/model-center">本機模型設定</a> <a id="memory" href="/local/memory" hidden>隔離記憶與待審候選</a> <small>隔離環境 · 不自動轉用雲端</small></p>
<p id="state">正在核對本機服務</p><div id="chat"></div><article id="draft" hidden aria-live="polite"></article><form><textarea required maxlength="2000" placeholder="與本機香香對話"></textarea><button>送出</button></form><details><summary>生成進度與診斷（未驗證內容）</summary><pre id="progress"></pre></details>
<script>
const id=crypto.randomUUID(),history=[],state=document.querySelector('#state'),chat=document.querySelector('#chat'),progress=document.querySelector('#progress'),draft=document.querySelector('#draft');
fetch('/api/local/status').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(s=>{const learning=s.memory==='isolated_local_learning';document.querySelector('#memory').hidden=!learning;state.textContent=s.model+' · '+(learning?'隔離記憶學習已啟用，偏好候選待批准；僅字詞檢索。':'記憶採唯讀來源快照。')+' 庫存為測試資料；業務排程與真實派工未啟動。'}).catch(e=>{state.textContent='服務核對失敗：'+e.message});
function renderFinal(v,message){
  draft.hidden=true;
  const body=v.body,failed=!!body.error,answer=body.reply||body.error?.message||body.error?.code||String(body.error||'沒有可顯示的答案');
  const a=document.createElement('article');a.textContent=answer;
  const receiptNotes={unavailable:'本輪記憶保存未確認。',partial:'本輪記憶回執部分未確認。',excluded:'本輪內容未納入長期記憶。',paused:'自動記憶目前暫停。'};
  if(receiptNotes[v.memoryReceipt]){const note=document.createElement('div');note.className='sources';note.textContent=receiptNotes[v.memoryReceipt];a.append(note);}
  if(body.memorySources?.kind==='memory_references_v1'&&body.memorySources.claimsVerified===false){
    const sources=document.createElement('div');sources.className='sources';
    sources.textContent='已載入的記憶來源（來源指標，不代表全文自動驗證）：\n'+body.memorySources.items.map(r=>r.documentId+' · 版本 '+r.version+' · '+r.scope+' · '+(r.date||'日期未知')).join('\n');a.append(sources);
  }
  chat.append(a);
  if(!failed)history.push({role:'user',content:message},{role:'assistant',content:answer,...(body.memorySources?{memorySources:body.memorySources}:{})});
  state.textContent=(failed?'未完成':'完成')+' · '+(v.timing.totalMs/1000).toFixed(2)+' 秒';
  return !failed;
}
document.querySelector('form').onsubmit=async e=>{
  e.preventDefault();const input=document.querySelector('textarea'),button=document.querySelector('button'),message=input.value;
  button.disabled=true;progress.textContent='';draft.hidden=true;state.textContent='準備上下文…';
  const user=document.createElement('article');user.textContent=message;chat.append(user);
  try{
    const r=await fetch('/api/v1/demo/intake',{method:'POST',headers:{'Content-Type':'application/json',Accept:'text/event-stream'},body:JSON.stringify({message,history,conversationId:id,interactionMode:'chat'})});
    if(!r.ok&&!r.headers.get('content-type')?.includes('text/event-stream'))throw Error('HTTP '+r.status);
    const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',finished=false;
    while(true){
      const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;
      while((end=buffer.indexOf('\n\n'))>=0){
        const line=buffer.slice(0,end);buffer=buffer.slice(end+2);if(!line.startsWith('data: '))continue;
        const v=JSON.parse(line.slice(6));
        if(v.type==='model_start')state.textContent='本機模型處理：'+v.phase;
        if(v.type==='model_delta')progress.textContent+=v.text;
        if(v.type==='reply_preview'){draft.hidden=false;draft.textContent='生成中的草稿，尚未核對來源：\n'+v.text;}
        if(v.type==='model_complete')state.textContent='核對答案與來源…';
        if(v.type==='final'){finished=true;if(renderFinal(v,message))input.value='';}
      }
    }
    if(!finished)throw Error('回應中斷，沒有完成證據');
  }catch(err){draft.hidden=true;state.textContent='未完成：'+err.message}finally{button.disabled=false}
};
</script></html>
