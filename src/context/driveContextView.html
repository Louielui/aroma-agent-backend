<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#283b32;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:32px auto;padding:0 24px}nav{display:flex;flex-wrap:wrap;gap:18px}a{color:#426958}h1{margin-bottom:8px}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}.intro,.meta{color:#687b70}.meta{font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}form{display:flex;flex:1;gap:10px;min-width:260px}input{flex:1;min-width:0;font:inherit;padding:11px;border:1px solid #a8b9ad;border-radius:9px}button{background:#fff;border:1px solid #a8b9ad;border-radius:9px;padding:10px 16px;color:#345944;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.card{background:#fff;border:1px solid #dce3dc;border-radius:13px;padding:20px;margin:14px 0;overflow-wrap:anywhere}.file-head{display:flex;justify-content:space-between;gap:16px}.file-head div{min-width:0}.warning{color:#98601f}summary{cursor:pointer}details{margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 system-ui,sans-serif;max-height:540px;overflow:auto;border-top:1px solid #e1e7e1;padding-top:16px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#audit{font-size:14px}@media(max-width:600px){main{padding:0 16px;margin:20px auto}.toolbar{display:block}.toolbar>button{margin-bottom:10px}form{min-width:0}.card{padding:16px}.file-head{display:block}}
</style></head><body><main><nav><a href="/demo" id="back"></a><a href="/live-context" id="github"></a><a href="/architecture" id="architecture"></a></nav><h1 id="title"></h1><p id="intro" class="intro"></p><div class="toolbar"><button id="root" type="button"></button><button id="parent" type="button" hidden></button><form id="search-form"><input id="query" maxlength="80" autocomplete="off"><button id="search" type="submit"></button></form></div><p id="notice" role="status" aria-live="polite"></p><div id="result"></div><p id="owner-only" class="meta"></p><details><summary id="audit-title"></summary><div id="audit"></div></details></main><script>
'use strict';const L=/*LABELS*/{};const el=id=>document.getElementById(id);const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
for(const [id,v] of [['back',L.back],['github',L.github],['architecture',L.architecture],['title',L.title],['intro',L.intro],['root',L.root],['parent',L.parent],['search',L.search],['owner-only',L.ownerOnly],['audit-title',L.audit]])el(id).textContent=v;document.title=L.title;el('query').placeholder=L.queryHint;el('query').setAttribute('aria-label',L.query);el('notice').textContent=L.idle;
const date=value=>value&&Number.isFinite(Date.parse(value))?new Date(value).toLocaleString():L.unknown;let folders=[];let active=false;
function sourceLink(row){const a=node('a',L.originalLink);const id=row.sourceId;if(typeof id!=='string'||!/^[A-Za-z0-9_-]{1,200}$/.test(id))return node('span',L.unknown);a.href=row.fields.mimeType==='application/vnd.google-apps.folder'?'https://drive.google.com/drive/folders/'+id:'https://drive.google.com/file/d/'+id+'/view';a.target='_blank';a.rel='noopener noreferrer';return a}
function detail(p,row){const d=node('details');d.append(node('summary',L.details),node('p',L.source+' · '+row.sourceId,'meta'),node('p',L.original+' · '+date(row.originalDate),'meta'),node('p',L.fetched+' · '+date(p.retrievedAt),'meta'),node('p',L.revision+' · '+(row.fields.version||L.unknown),'meta'),node('p',L.scope+' · '+p.coverage.scope,'meta'),node('p',L.dataOnly,'meta'));return d}
function render(report){const p=report.pack,root=el('result');root.replaceChildren();if(p.state!=='ok'){el('notice').textContent=L.error;return}el('notice').textContent=(report.source?.name||L.title)+' · '+L.count+' · '+p.count;const summary=node('section',null,'card');summary.append(node('p',L.fetched+' · '+date(p.retrievedAt),'meta'),node('p',L.complete+' · '+(p.coverage.complete===true?L.full:p.coverage.complete===false?L.partial:L.unknown)+(p.coverage.truncated===true?' · '+L.truncated:''),'meta'));if(p.coverage.excluded>0)summary.append(node('p',L.excluded+' · '+p.coverage.excluded,'meta'));root.append(summary);if(!p.content.length)root.append(node('p',L.empty));for(const row of p.content){const card=node('article',null,'card');card.dataset.sourceId=row.sourceId;const head=node('div',null,'file-head'),names=node('div');names.append(node('h2',row.title||row.sourceId),node('p',L.original+' · '+date(row.originalDate),'meta'));head.append(names);card.append(head);const actions=node('div',null,'actions');actions.append(sourceLink(row));if(row.fields.mimeType==='application/vnd.google-apps.folder'){const b=node('button',L.openFolder);b.type='button';b.addEventListener('click',()=>{folders.push(row.sourceId);void read('list',{folderId:row.sourceId})});actions.append(b)}else if(p.operation!=='get'){const b=node('button',L.read);b.type='button';b.addEventListener('click',()=>void read('get',{fileId:row.sourceId}));actions.append(b)}card.append(actions);if(row.fields.contentState==='text'){card.append(node('p',row.truncated?L.textPartial:L.text,row.truncated?'warning':'meta'),node('pre',row.content))}else if(p.operation==='get')card.append(node('p',L.reasons[row.fields.contentReason]||L.metadataOnly,'warning'));card.append(detail(p,row));root.append(card)}el('parent').hidden=!folders.length}
function disable(value){active=value;for(const b of document.querySelectorAll('button'))b.disabled=value;el('query').disabled=value}
async function audit(){try{const r=await fetch('/api/v1/live-context/activity',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const events=data.events.filter(e=>e.source==='drive');el('audit').replaceChildren();if(!events.length)el('audit').append(node('p',L.auditEmpty));for(const e of events)el('audit').append(node('p',date(e.at)+' · '+e.tool+' · '+e.result+(e.count===null?'':' · '+e.count)))}catch(_){el('audit').textContent=L.auditError}}
async function read(operation,input){if(active)return;disable(true);el('result').replaceChildren();el('notice').textContent=L.loading;try{const r=await fetch('/api/v1/live-context/drive',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation,input})});if(!r.ok)throw Error();render(await r.json())}catch(_){el('notice').textContent=L.error;el('result').replaceChildren()}finally{disable(false);await audit()}}
el('root').addEventListener('click',()=>{folders=[];el('parent').hidden=true;void read('list',{})});el('parent').addEventListener('click',()=>{folders.pop();el('parent').hidden=!folders.length;void read('list',folders.length?{folderId:folders.at(-1)}:{})});el('search-form').addEventListener('submit',event=>{event.preventDefault();if(!el('query').value.trim())return;void read('search',{query:el('query').value.trim()})});el('audit-title').parentElement.addEventListener('toggle',event=>{if(event.target.open)void audit()});
</script></body></html>
