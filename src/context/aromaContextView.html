<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#283b32;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:32px auto;padding:0 24px}nav,.toolbar{display:flex;flex-wrap:wrap;gap:14px}a{color:#426958}h1{margin-bottom:8px}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}.meta{color:#687b70;font-size:14px}.toolbar{margin:20px 0}button,input,select{font:inherit;border:1px solid #a8b9ad;border-radius:9px;padding:10px 14px;background:#fff;color:#345944}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}form{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}input{flex:1;min-width:160px}.card{background:#fff;border:1px solid #dce3dc;border-radius:13px;padding:20px;margin:14px 0;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer}.warning{color:#98601f}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 system-ui,sans-serif;max-height:440px;overflow:auto}@media(max-width:600px){main{padding:0 16px;margin:20px auto}.card{padding:16px}}
</style></head><body><main><nav><a href="/demo" id="back"></a><a href="/live-context" id="github"></a><a href="/drive-context" id="drive"></a><a href="/architecture" id="architecture"></a></nav><h1 id="title"></h1><p id="intro" class="meta"></p><div class="toolbar"><select id="resource"><option value="aroma.order_planning" id="planning"></option><option value="aroma.invoices" id="invoices"></option></select><button id="list" type="button"></button><button id="metadata" type="button"></button></div><details><summary id="search-options"></summary><form id="search-form"><input id="query" maxlength="80" autocomplete="off"><button id="search" type="submit"></button></form><form id="get-form"><input id="source-id" maxlength="200" autocomplete="off"><button id="get" type="submit"></button></form></details><p id="notice" role="status" aria-live="polite"></p><div id="result"></div><p id="owner-only" class="meta"></p><details><summary id="audit-title"></summary><div id="audit"></div></details></main><script>
'use strict';const L=/*LABELS*/{},el=id=>document.getElementById(id),node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
for(const [id,v]of [['title',L.title],['intro',L.intro],['back',L.back],['github',L.github],['drive',L.drive],['architecture',L.architecture],['planning',L.planning],['invoices',L.invoices],['list',L.list],['metadata',L.metadata],['search-options',L.search],['search',L.search],['get',L.get],['owner-only',L.ownerOnly],['audit-title',L.audit]])el(id).textContent=v;
document.title=L.title;el('resource').setAttribute('aria-label',L.title);el('query').placeholder=L.query;el('query').setAttribute('aria-label',L.query);el('source-id').placeholder=L.sourceId;el('source-id').setAttribute('aria-label',L.sourceId);el('notice').textContent=L.idle;
const date=v=>v&&Number.isFinite(Date.parse(v))?(/^\d{4}-\d{2}-\d{2}$/.test(v)?v:new Date(v).toLocaleString()):L.unknown;let active=false;
function render(report){const p=report.pack,root=el('result');root.replaceChildren();if(p.state!=='ok'){el('notice').textContent=L.error;return}el('notice').textContent=(p.resource==='aroma.invoices'?L.invoices:L.planning)+' · '+L.count+' · '+p.count;
 const summary=node('section',null,'card');summary.append(node('p',L.fetched+' · '+date(p.retrievedAt),'meta'),node('p',L.asOf+' · '+date(p.coverage.dataAsOf),'meta'),node('p',L.scope+' · '+p.coverage.scope,'meta'),node('p',L.complete+' · '+(p.coverage.complete===true?L.full:p.coverage.complete===false?L.partial:L.unknown)+(p.coverage.truncated===true?' · '+L.truncated:''),'meta'),node('p',L.limits,'warning'));if(p.coverage.queryScope?.declaredBy==='reader')summary.append(node('p',L.reader,'meta'));root.append(summary);
 if(!p.content.length)root.append(node('p',L.empty));for(const row of p.content){const card=node('article',null,'card');card.dataset.sourceId=row.sourceId;card.append(node('h2',row.title||row.sourceId),node('p',L.original+' · '+date(row.originalDate),'meta'));for(const [key,label]of Object.entries(L.fields))if(Object.hasOwn(row.fields,key))card.append(node('p',label+' · '+row.fields[key]));const d=node('details');d.append(node('summary',L.details),node('p',L.source+' · '+p.sourceId+' · '+row.sourceId,'meta'),node('pre',JSON.stringify(row.fields,null,2)));card.append(d);root.append(card)}}
async function audit(){try{const r=await fetch('/api/v1/live-context/activity',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const events=data.events.filter(e=>e.source==='aroma_system');el('audit').replaceChildren();if(!events.length)el('audit').append(node('p',L.auditEmpty));for(const e of events)el('audit').append(node('p',date(e.at)+' · '+e.tool+' · '+e.result+(e.count===null?'':' · '+e.count)))}catch(_){el('audit').textContent=L.auditError}}
async function read(operation,input){if(active)return;active=true;for(const n of document.querySelectorAll('button,input,select'))n.disabled=true;el('result').replaceChildren();el('notice').textContent=L.loading;try{const r=await fetch('/api/v1/live-context/aroma',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource:el('resource').value,operation,input})});if(!r.ok)throw Error();render(await r.json())}catch(_){el('notice').textContent=L.error;el('result').replaceChildren()}finally{active=false;for(const n of document.querySelectorAll('button,input,select'))n.disabled=false;await audit()}}
el('list').addEventListener('click',()=>void read('list',{}));el('metadata').addEventListener('click',()=>void read('readMetadata',{}));el('resource').addEventListener('change',()=>{el('result').replaceChildren();el('notice').textContent=L.idle});el('search-form').addEventListener('submit',e=>{e.preventDefault();if(el('query').value.trim())void read('search',{query:el('query').value.trim()})});el('get-form').addEventListener('submit',e=>{e.preventDefault();if(el('source-id').value.trim())void read('get',{sourceId:el('source-id').value.trim()})});el('audit-title').parentElement.addEventListener('toggle',e=>{if(e.target.open)void audit()});
</script></body></html>
