<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#283b32;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:32px auto;padding:0 24px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#426958}h1{margin-bottom:8px}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.intro{color:#687b70;max-width:780px}.actions{display:flex;align-items:center;gap:18px;margin:24px 0}button{background:#fff;border:1px solid #a8b9ad;border-radius:9px;padding:11px 18px;color:#345944;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.card{background:#fff;border:1px solid #dce3dc;border-radius:14px;padding:22px;margin:18px 0}.versions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.version span{display:block;color:#63766b}.version code{font-size:22px;word-break:break-all}.warning{color:#a16e22}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid .card{margin:0}ul{padding-left:20px;margin:8px 0}li{margin:12px 0;overflow-wrap:anywhere}.meta{font-size:14px;color:#718277}details{margin-top:14px}summary{cursor:pointer}#audit{font-size:14px}.empty{color:#77887c}@media(max-width:700px){main{padding:0 16px;margin:20px auto}.grid,.versions{grid-template-columns:1fr}.version code{font-size:18px}.card{padding:18px}}
</style></head><body><main><nav><a href="/demo" id="back"></a><a href="/architecture" id="architecture"></a><a href="/drive-context" id="drive"></a></nav><h1 id="title"></h1><p class="intro" id="intro"></p><div class="actions"><button id="refresh" type="button"></button><span id="cache-note" class="meta"></span></div><p id="notice" role="status" aria-live="polite"></p><div id="result"></div><p id="public-only" class="meta"></p><details><summary id="audit-title"></summary><div id="audit"></div></details></main>
<script>
'use strict';const L=/*LABELS*/{};const el=id=>document.getElementById(id);const node=(tag,text,className)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(className)n.className=className;return n};
for(const [id,value] of [['title',L.title],['intro',L.intro],['back',L.back],['refresh',L.refresh],['public-only',L.publicOnly],['audit-title',L.audit],['architecture',L.architecture],['drive',L.drive]])el(id).textContent=value;document.title=L.title;el('notice').textContent=L.idle;
const date=value=>value&&Number.isFinite(Date.parse(value))?new Date(value).toLocaleString():L.unknown;const hash=value=>typeof value==='string'&&/^[a-f0-9]{40}$/.test(value)?value.slice(0,12):L.unknown;
function link(url,text){try{const u=new URL(url);if(u.origin!=='https://github.com'||u.username||u.password)return node('span',text);const a=node('a',text);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch(_){return node('span',text)}}
function render(report){const root=el('result');root.replaceChildren();const versions=node('section',null,'card');versions.id='versions';versions.append(node('h2',L.versions));const grid=node('div',null,'versions');for(const [label,value] of [[L.remote,report.remoteCommit],[L.deployed,report.runtime.deployedCommit],[L.running,report.runtime.bootCommit]]){const item=node('div',null,'version');item.append(node('span',label),node('code',hash(value)));grid.append(item)}versions.append(grid);if(report.runtime.restartRequired===true)versions.append(node('p',L.restart,'warning'));const testNames={not_published:L.testsAbsent,published_success:L.testsSuccess,failed:L.testsFailed,pending:L.testsPending,incomplete:L.testsIncomplete,unavailable:L.testsUnavailable};versions.append(node('p',L.tests+' · '+(testNames[report.tests.state]||L.testsUnavailable)));root.append(versions);el('cache-note').textContent=(report.cached?L.cached:L.fresh)+' · '+date(report.retrievedAt);el('notice').textContent=(report.repository||L.unknown)+' · '+(report.branch||L.unknown);
 const packs=node('div',null,'grid');packs.id='source-packs';const names={'github.repository':L.metadata,'github.commits':L.commits,'github.pull_requests':L.pullRequests,'github.checks':L.checks,'github.statuses':L.statuses};for(const p of report.packs){const card=node('section',null,'card');card.dataset.resource=p.resource;card.append(node('h2',names[p.resource]||p.resource));if(p.state!=='ok')card.append(node('p',L.unavailable,'warning'));else{card.append(node('p',L.count+' · '+p.count,'meta'));if(!p.content.length)card.append(node('p',L.empty,'empty'));const list=node('ul');for(const row of p.content){const li=node('li');li.append(link(row.link,row.title||row.sourceId));if(row.fields?.status)li.append(node('div',row.fields.status+(row.fields.conclusion?' · '+row.fields.conclusion:''),'meta'));li.append(node('div',L.original+' · '+date(row.originalDate),'meta'));list.append(li)}card.append(list)}const details=node('details');details.append(node('summary',L.details),node('p',L.fetched+' · '+date(p.retrievedAt),'meta'),node('p',L.scope+' · '+p.coverage.scope,'meta'),node('p',L.complete+' · '+(p.coverage.complete===true?L.full:p.coverage.complete===false?L.partial:L.unknown)+(p.coverage.truncated===true?' · '+L.truncated:''),'meta'));card.append(details);packs.append(card)}root.append(packs)}
async function audit(){try{const r=await fetch('/api/v1/live-context/activity',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();el('audit').replaceChildren();if(!data.events.length)el('audit').append(node('p',L.auditEmpty));for(const event of data.events)el('audit').append(node('p',date(event.at)+' · '+event.tool+' · '+event.result+(event.count===null?'':' · '+event.count)))}catch(_){el('audit').textContent=L.auditError}}
el('refresh').addEventListener('click',async()=>{el('refresh').disabled=true;el('notice').textContent=L.loading;try{const r=await fetch('/api/v1/live-context/development',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error();render((await r.json()).report)}catch(_){el('notice').textContent=L.error}finally{el('refresh').disabled=false;await audit()}});el('audit-title').parentElement.addEventListener('toggle',event=>{if(event.target.open)void audit()});
</script></body></html>
