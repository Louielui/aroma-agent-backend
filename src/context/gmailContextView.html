<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#283b32;font:16px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:32px auto;padding:0 24px}nav,.toolbar{display:flex;flex-wrap:wrap;gap:12px}a{color:#426958}h1{margin-bottom:8px}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}.meta{color:#687b70;font-size:14px}.toolbar{margin:20px 0}button,input,select{font:inherit;border:1px solid #a8b9ad;border-radius:9px;padding:10px 14px;background:#fff;color:#345944}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}form{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}input{flex:1;min-width:160px}.card{background:#fff;border:1px solid #dce3dc;border-radius:13px;padding:20px;margin:14px 0;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer}.warning{color:#98601f}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 system-ui,sans-serif;max-height:400px;overflow:auto}@media(max-width:600px){main{padding:0 16px;margin:20px auto}.card{padding:16px}}
</style></head><body><main><nav><a href="/demo" id="back"></a><a href="/architecture" id="architecture"></a></nav><h1 id="title"></h1><p id="intro" class="meta"></p><div class="toolbar"><select id="mailbox"><option value="gmail.owner_mail" id="owner"></option><option value="gmail.admin_mail" id="admin"></option></select><select id="window"><option value="today" id="today"></option><option value="unread" id="unread"></option><option value="latest" id="latest"></option></select><button id="list" type="button"></button><button id="metadata" type="button"></button></div><details><summary id="options"></summary><form id="search-form"><select id="field"><option value="keyword" id="keyword"></option><option value="subject" id="subject"></option><option value="from" id="from"></option></select><input id="query" maxlength="80" autocomplete="off"><button id="search" type="submit"></button></form><form id="get-form"><input id="message-id" maxlength="100" autocomplete="off"><button id="get" type="submit"></button></form></details><p id="notice" role="status" aria-live="polite"></p><div id="result"></div><p id="owner-only" class="meta"></p><details><summary id="audit-title"></summary><div id="audit"></div></details></main><script>
'use strict';const L=/*LABELS*/{},el=id=>document.getElementById(id),node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
for(const [id,v]of [['title',L.title],['intro',L.intro],['back',L.back],['architecture',L.architecture],['owner',L.owner],['admin',L.admin],['today',L.today],['unread',L.unread],['latest',L.latest],['list',L.list],['metadata',L.metadata],['options',L.options],['keyword',L.keyword],['subject',L.subject],['from',L.from],['search',L.search],['get',L.get],['owner-only',L.ownerOnly],['audit-title',L.audit]])el(id).textContent=v;
document.title=L.title;el('mailbox').setAttribute('aria-label',L.title);el('window').setAttribute('aria-label',L.scope);el('field').setAttribute('aria-label',L.search);el('query').placeholder=L.query;el('query').setAttribute('aria-label',L.query);el('message-id').placeholder=L.messageId;el('message-id').setAttribute('aria-label',L.messageId);el('notice').textContent=L.idle;
const date=v=>v&&Number.isFinite(Date.parse(v))?new Date(v).toLocaleString(undefined,{timeZone:'America/Winnipeg'}):L.unknown;let active=false;
function render(report){const p=report.pack,root=el('result');root.replaceChildren();if(p.state!=='ok'){el('notice').textContent=L.error;return}el('notice').textContent=L.count+' · '+p.count;
 const summary=node('section',null,'card');summary.append(node('p',(report.mailbox==='admin'?L.admin:L.owner)),node('p',L.fetched+' · '+date(p.retrievedAt),'meta'),node('p',L.scope+' · '+p.coverage.scope,'meta'),node('p',L.coverage+' · '+(p.coverage.complete===true?L.complete:p.coverage.complete===false?L.partial:L.unknown)+(p.coverage.truncated===true?' · '+L.truncated:''),'meta'),node('p',L.limits,'warning'));root.append(summary);
 if(!p.content.length)root.append(node('p',L.empty));for(const row of p.content){const card=node('article',null,'card');card.dataset.sourceId=row.sourceId;card.append(node('h2',row.title||row.sourceId));if(p.operation!=='readMetadata'){card.append(node('p',L.from+' · '+(row.fields.from||L.unknown)),node('p',L.original+' · '+date(row.originalDate),'meta'));const b=node('button',L.get);b.type='button';b.addEventListener('click',()=>void read('get',{messageId:row.sourceId}));card.append(b)}
 if(window.parent!==window&&p.operation!=='readMetadata'){const actions=node('div',null,'toolbar');for(const action of ['discuss','track']){const b=node('button',L[action]);b.type='button';b.addEventListener('click',()=>window.parent.postMessage({type:'xiangxiang-email-context',action,mailbox:report.mailbox,messageId:row.sourceId,title:String(row.title||row.sourceId).slice(0,160)},location.origin));actions.append(b)}card.append(actions)}
 if(row.link){const a=node('a',L.source);a.href=row.link;a.target='_blank';a.rel='noopener noreferrer';const paragraph=node('p');paragraph.append(a);card.append(paragraph)}const d=node('details');d.append(node('summary',L.details),node('p',L.messageId+' · '+row.sourceId,'meta'));if(p.operation==='get')d.append(node('p',row.fields.originalBodyComplete===true?L.bodyComplete:L.bodyPartial,'meta'));d.append(node('pre',row.content||L.unknown));if(row.truncated)d.append(node('p',L.truncated,'warning'));card.append(d);root.append(card)}}
async function audit(){try{const r=await fetch('/api/v1/live-context/activity',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();el('audit').replaceChildren();const events=data.events.filter(e=>e.source==='gmail');if(!events.length)el('audit').append(node('p',L.auditEmpty));for(const e of events)el('audit').append(node('p',date(e.at)+' · '+e.tool+' · '+e.result+(e.count===null?'':' · '+e.count)))}catch(_){el('audit').textContent=L.auditError}}
async function read(operation,input){if(active)return;active=true;for(const n of document.querySelectorAll('button,input,select'))n.disabled=true;el('result').replaceChildren();el('notice').textContent=L.loading;try{const r=await fetch('/api/v1/live-context/gmail',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource:el('mailbox').value,operation,input})});if(!r.ok)throw Error();render(await r.json())}catch(_){el('notice').textContent=L.error;el('result').replaceChildren()}finally{active=false;for(const n of document.querySelectorAll('button,input,select'))n.disabled=false;await audit()}}
el('list').addEventListener('click',()=>void read('list',{window:el('window').value}));el('metadata').addEventListener('click',()=>void read('readMetadata',{}));for(const id of ['window','mailbox'])el(id).addEventListener('change',()=>{el('result').replaceChildren();el('notice').textContent=L.idle;el('message-id').value=''});el('search-form').addEventListener('submit',e=>{e.preventDefault();if(el('query').value.trim())void read('search',{query:el('query').value.trim(),field:el('field').value})});el('get-form').addEventListener('submit',e=>{e.preventDefault();if(el('message-id').value.trim())void read('get',{messageId:el('message-id').value.trim()})});el('audit-title').parentElement.addEventListener('toggle',e=>{if(e.target.open)void audit()});
</script></body></html>
