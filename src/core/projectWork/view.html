<!doctype html><html lang="/*LOCALE*/"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiangxiang</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#24392f;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:32px auto;padding:0 24px}a{color:#3e6350}nav{display:flex;gap:24px}.card{background:#fff;border:1px solid #dce3d9;border-radius:16px;padding:24px;margin:20px 0}h1{font-size:30px}h2{font-size:20px}.muted{color:#69766c}button{border:0;border-radius:8px;padding:11px 18px;background:#365b46;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.45}label{display:block;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4ef;padding:14px;max-height:400px;overflow:auto;font-size:13px}details{margin:12px 0}summary{cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap}#message{min-height:26px}
</style></head><body><main><nav><a href="/workers">06／07／08</a><a href="/architecture">Xiangxiang</a></nav><h1 id="title"></h1><p id="intro"></p><section class="card"><h2>Aroma Agent Backend</h2><p id="scope"></p><p class="muted" id="limits"></p><button id="prepare"></button><p id="message" role="status"></p><div id="prepared" hidden><p id="source"></p><details><summary id="details"></summary><pre id="evidence"></pre></details><label><input type="checkbox" id="approvalCheck"><span id="approval"></span></label><button id="approve" disabled></button></div></section><h2 id="history"></h2><div id="runs"></div></main><script>
'use strict'; const L=/*LABELS*/, $=id=>document.getElementById(id); let approval=null, posting=false, active=false, last='';
for(const id of ['title','intro','scope','limits','prepare','details','approval','approve','history'])$(id).textContent=L[id];document.title=L.title;
const states=new Set(['awaiting_approval','queued','checking','coding','reviewing']);
async function api(body){const r=await fetch('/api/v1/project-work',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const v=await r.json();if(!r.ok||v.error)throw Error(v.error||L.error);return v}
function controls(){ $('prepare').disabled=posting||active; $('approve').disabled=posting||!approval||!$('approvalCheck').checked }
$('approvalCheck').onchange=controls;
async function act(fn){posting=true;controls();try{await fn();$('message').textContent=''}catch(e){$('message').textContent=L.error+' · '+e.message}finally{posting=false;controls();await refresh()}}
$('prepare').onclick=()=>act(async()=>{const v=await api({op:'prepare',projectId:'aroma-agent-backend',recipe:'context-fields-snapshot-v1',requestId:crypto.randomUUID()});approval=v.approval;$('prepared').hidden=!approval;$('approvalCheck').checked=false;$('source').textContent=L.source+' · '+v.run.source.evidence.revision.slice(0,12);$('evidence').textContent=JSON.stringify({workOrder:v.run.workOrder,source:v.run.source,approvalHash:v.run.approvalHash},null,2)});
$('approve').onclick=()=>act(async()=>{const once=approval;approval=null;$('prepared').hidden=true;await api({op:'approve',id:once.id,hash:once.hash,nonce:once.nonce})});
function pre(parent,text){const p=document.createElement('pre');p.textContent=text;parent.append(p)}
function detail(parent,label,text){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=label;d.append(s);pre(d,text);parent.append(d)}
async function refresh(){try{const v=await api();active=v.runs.some(r=>states.has(r.state));const serial=JSON.stringify(v.runs);if(last!==serial){last=serial;$('runs').replaceChildren();if(!v.runs.length)$('runs').textContent=L.empty;for(const r of v.runs){const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=(L[r.state]||r.state)+' · '+new Date(r.startedAt).toLocaleString();section.append(h);const p=document.createElement('p');p.textContent=L.source+' · '+r.source.evidence.revision.slice(0,12);section.append(p);if(r.reason)pre(section,r.reason);if(states.has(r.state)){const b=document.createElement('button');b.textContent=L.cancel;b.onclick=()=>act(()=>api({op:'cancel',id:r.id}));section.append(b)}if(r.result){const p=document.createElement('p');p.textContent=L.result+' · '+r.result.summary;section.append(p);detail(section,L.tests,JSON.stringify({baseline:r.result.baseline,tests:r.result.tests},null,2));for(const c of r.result.changes){detail(section,L.before+' · '+c.file,c.before);detail(section,L.after+' · '+c.file,c.after)}if(r.review)detail(section,L.review,JSON.stringify(r.review,null,2))}detail(section,L.details,JSON.stringify({id:r.id,source:r.source,approvalHash:r.approvalHash,steps:r.steps,patchHash:r.result?.patchHash,appliedToLive:r.appliedToLive},null,2));$('runs').append(section)}}if(approval&&!v.runs.some(r=>r.id===approval.id&&r.state==='awaiting_approval')){approval=null;$('prepared').hidden=true}controls()}catch(e){$('message').textContent=L.error}}
refresh();setInterval(refresh,2000);
</script></body></html>
