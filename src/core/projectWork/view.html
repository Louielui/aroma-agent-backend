<!doctype html><html lang="/*LOCALE*/"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiangxiang</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#24392f;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:32px auto;padding:0 24px}a{color:#3e6350}nav{display:flex;gap:24px}.card{background:#fff;border:1px solid #dce3d9;border-radius:16px;padding:24px;margin:20px 0}h1{font-size:30px}h2{font-size:20px}.muted{color:#69766c}button{border:0;border-radius:8px;padding:11px 18px;background:#365b46;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.45}label{display:block;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4ef;padding:14px;max-height:400px;overflow:auto;font-size:13px}details{margin:12px 0}summary{cursor:pointer}.actions{display:flex;gap:12px;flex-wrap:wrap}#message{min-height:26px}
.ui-preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.ui-preview-grid a{min-width:0;display:block;text-decoration:none;font-size:13px}.ui-preview-grid img{display:block;width:100%;height:180px;object-fit:contain;object-position:top;border:1px solid #dce3d9;border-radius:8px;background:#f5f5ef}
.result-focused .ui-preview-grid img{height:320px}.result-focused main{max-width:1200px}.actions button[aria-pressed="false"]{background:#eef2ed;color:#365b46}.actions button:focus-visible{outline:3px solid #8aab99;outline-offset:2px}@media(max-width:600px){main{padding:0 16px}.ui-preview-grid{grid-template-columns:1fr}nav{flex-wrap:wrap;gap:12px}}
</style></head><body><main><nav><a href="/project-tasks" id="taskRegister"></a><a href="/workers">06／07／08</a><a href="/architecture">Xiangxiang</a><a id="login" href="/owner/login?next=%2Fproject-work" hidden></a><a href="/demo" id="backChat"></a></nav><h1 id="title"></h1><p id="intro"></p><p id="message" role="status"></p><section class="card" id="preparePanel"><h2>Aroma Agent Backend</h2><p id="scope"></p><label><span id="recipeLabel"></span><select id="recipe"><option value="context-coverage-snapshot-v3"></option><option value="context-provenance-snapshot-v2"></option><option value="context-fields-snapshot-v1"></option></select></label><p class="muted" id="limits"></p><button id="prepare"></button><div id="prepared" hidden><p id="source"></p><details><summary id="details"></summary><pre id="evidence"></pre></details><label><input type="checkbox" id="approvalCheck"><span id="approval"></span></label><button id="approve" disabled></button></div></section><section class="card" id="adoptPanel"><h2 id="adoptTitle"></h2><p id="adoptIntro"></p><div id="adoptPrepared" hidden><h3 id="adoptHeading"></h3><div id="adoptComparison"></div><label><input type="checkbox" id="adoptCheck"><span id="adoptApproval"></span></label><button id="adoptApprove" disabled></button></div></section><h2 id="history"></h2><div id="runs"></div><h2 id="adoptHistory"></h2><div id="adoptions"></div></main><script>
'use strict'; const L=/*LABELS*/, $=id=>document.getElementById(id); let approval=null, adoptionApproval=null, posting=false, refreshing=false, active=false, last='', work=[], adoptions=[];
for(const id of ['title','intro','scope','limits','prepare','details','approval','approve','history','adoptTitle','adoptIntro','adoptApproval','adoptApprove','adoptHistory','login'])$(id).textContent=L[id];document.title=L.title;$('taskRegister').textContent=L.taskRegister;$('recipeLabel').textContent=L.recipe;$('recipe').options[0].textContent=L.coverage;$('recipe').options[1].textContent=L.multi;$('recipe').options[2].textContent=L.single;

const requestedRun=new URLSearchParams(location.search).get('run'), focused=requestedRun!==null;
const validRun=focused&&/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(requestedRun);
$('backChat').textContent=L.backChat;
if(focused){document.body.classList.add('result-focused');$('preparePanel').hidden=true;$('adoptPanel').hidden=true;$('title').textContent=L.resultTitle;document.title=L.resultTitle;$('intro').textContent=L.resultIntro;$('history').hidden=true;$('login').href='/owner/login?next='+encodeURIComponent(location.pathname+location.search)}
const states=new Set(['awaiting_approval','queued','checking','coding','reviewing']), adoptionStates=new Set(['queued','testing','applying','awaiting_restart']);
async function api(body,lane='project-work'){const r=await fetch('/api/v1/'+lane,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(r.status===401){approval=null;adoptionApproval=null;$('prepared').hidden=true;$('adoptPrepared').hidden=true;$('login').hidden=false;throw Error(L.login)}const v=await r.json();if(!r.ok||v.error)throw Error(v.error||L.error);return v}
function controls(){ $('recipe').disabled=posting||active||!!approval||!!adoptionApproval; $('prepare').disabled=posting||active||!!adoptionApproval; $('approve').disabled=posting||active||!approval||!$('approvalCheck').checked; $('adoptApprove').disabled=posting||active||!adoptionApproval||!$('adoptCheck').checked; document.querySelectorAll('[data-action]').forEach(b=>{b.disabled=posting||active||!!approval||!!adoptionApproval; if(['reload','workCancel'].includes(b.dataset.action))b.disabled=posting}) }
$('approvalCheck').onchange=controls;$('adoptCheck').onchange=controls;
async function act(fn){posting=true;controls();try{await fn();$('message').textContent=''}catch(e){$('message').textContent=L.error+' · '+e.message}finally{posting=false;controls();await refresh()}}
$('prepare').onclick=()=>act(async()=>{const v=await api({op:'prepare',projectId:'aroma-agent-backend',recipe:$('recipe').value,requestId:crypto.randomUUID()});approval=v.approval;$('prepared').hidden=!approval;$('approvalCheck').checked=false;$('source').textContent=L.source+' · '+v.run.source.evidence.revision.slice(0,12);$('evidence').textContent=JSON.stringify({workOrder:v.run.workOrder,source:v.run.source,approvalHash:v.run.approvalHash},null,2)});
$('approve').onclick=()=>act(async()=>{const once=approval;approval=null;$('prepared').hidden=true;await api({op:'approve',id:once.id,hash:once.hash,nonce:once.nonce})});
$('adoptApprove').onclick=()=>act(async()=>{const once=adoptionApproval;adoptionApproval=null;$('adoptPrepared').hidden=true;await api({op:'approve',id:once.id,hash:once.hash,nonce:once.nonce},'project-adoption')});
function pre(parent,text){const p=document.createElement('pre');p.textContent=text;parent.append(p)}
function text(parent,value){const p=document.createElement('p');p.textContent=value;parent.append(p)}
function detail(parent,label,value){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=label;d.append(s);pre(d,typeof value==='string'?value:JSON.stringify(value,null,2));parent.append(d)}
function button(parent,label,action,fn){const b=document.createElement('button');b.textContent=label;b.dataset.action=action;b.onclick=()=>act(fn);parent.append(b)}
async function prepareAdoption(runId,action){const v=await api({op:'prepare',action,runId,requestId:crypto.randomUUID()},'project-adoption');adoptionApproval=v.approval;$('adoptPrepared').hidden=!adoptionApproval;$('adoptPanel').hidden=focused&&!adoptionApproval;$('adoptCheck').checked=false;$('adoptHeading').textContent=L.preparing+' · '+(action==='adopt'?L.adopt:L.revert);$('adoptComparison').replaceChildren();text($('adoptComparison'),L.source+' · '+v.run.source.evidence.revision);if(action==='rollback')text($('adoptComparison'),L.rollbackNote);detail($('adoptComparison'),L.before,v.run.before);detail($('adoptComparison'),L.after,v.run.after);const original=work.find(r=>r.id===runId);if(original)browser($('adoptComparison'),original);detail($('adoptComparison'),L.tests,JSON.stringify(original?.result?.tests,null,2));detail($('adoptComparison'),L.review,JSON.stringify(original?.review,null,2));detail($('adoptComparison'),L.details,JSON.stringify({id:v.run.id,source:v.run.source.evidence,approvalHash:v.run.approvalHash,expiresAt:v.run.expiresAt},null,2));$('adoptPrepared').scrollIntoView({behavior:'smooth',block:'center'})}
function browser(parent,r,expanded=false){const valid=p=>/^browser-(zh|en)-(1280|390)\.png$/.test(p.name),after=(r.result?.tests?.browser||[]).filter(valid),before=(r.result?.baseline?.browser||[]).filter(valid);if(!after.length)return;const d=document.createElement("details"),s=document.createElement("summary"),grid=document.createElement("div");s.textContent=L.preview;if(expanded)d.open=true;d.append(s);const visual=r.review?.visual;text(d,visual?(visual.verdict==="pass"?L.visualPassed:L.visualChanges):L.visualUnreviewed);if(visual?.summary){if(expanded)detail(d,L.visualNotes,visual.summary);else text(d,visual.summary)}const controls=document.createElement("div"),buttons=[];controls.className="actions";function show(phase){grid.replaceChildren();for(const b of buttons)b.setAttribute("aria-pressed",String(b.dataset.phase===phase));for(const p of phase==="before"?before:after){const a=document.createElement("a"),img=document.createElement("img"),caption=document.createElement("span"),label=p.name.startsWith("browser-en-")?"English":"中文",width=p.name.includes("-1280.")?"1280":"390";a.href="/api/v1/project-work/"+encodeURIComponent(r.id)+"/browser/"+encodeURIComponent(p.name)+(phase==="before"?"?phase=before":"");a.target="_blank";a.rel="noopener";img.src=a.href;img.alt=(phase==="before"?L.before:L.after)+" · "+label+" · "+width;img.loading="lazy";caption.textContent=label+" · "+width;a.append(img,caption);grid.append(a)}}if(before.length){for(const phase of ["before","after"]){const b=document.createElement("button");b.type="button";b.dataset.phase=phase;b.textContent=phase==="before"?L.before:L.after;b.onclick=()=>show(phase);buttons.push(b);controls.append(b)}d.append(controls)}grid.className="ui-preview-grid";show("after");d.append(grid);parent.append(d)}
function render(){const serial=JSON.stringify({work,adoptions});if(last===serial)return;last=serial;$('runs').replaceChildren();if(!work.length)$('runs').textContent=L.empty;
for(const r of work){const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=(L[r.state]||r.state)+' · '+new Date(r.startedAt).toLocaleString();section.append(h);if(!focused){text(section,L.source+' · '+r.source.evidence.revision.slice(0,12));text(section,(r.workOrder.recipe==='context-provenance-snapshot-v2'?L.multi:L.single)+' · '+r.workOrder.allowedFiles.join(', '))}if(r.reason)pre(section,r.reason);if(states.has(r.state))button(section,L.cancel,'workCancel',()=>api({op:'cancel',id:r.id}));if(r.result){browser(section,r,focused);const adopted=adoptions.some(a=>a.workRunId===r.id&&a.action==='adopt'&&['completed','awaiting_restart'].includes(a.state));if(focused){text(section,adopted?L.adoptHistory:L.result);detail(section,L.result,r.result.summary)}else{text(section,(adopted?L.adoptHistory:L.result)+' · '+r.result.summary)}detail(section,L.tests,JSON.stringify({baseline:r.result.baseline,tests:r.result.tests},null,2));for(const c of r.result.changes){detail(section,L.before+' · '+c.file,c.before);detail(section,L.after+' · '+c.file,c.after)}if(r.review)detail(section,L.review,JSON.stringify(r.review,null,2));if(r.state==='completed'&&r.review?.verdict==='pass'&&!adopted)button(section,L.adopt,'adopt',()=>prepareAdoption(r.id,'adopt'))}detail(section,L.details,JSON.stringify({id:r.id,source:r.source,approvalHash:r.approvalHash,steps:r.steps,patchHash:r.result?.patchHash,appliedToLive:r.appliedToLive},null,2));$('runs').append(section)}
$('adoptions').replaceChildren();const shownAdoptions=focused?adoptions.filter(r=>r.workRunId===requestedRun):adoptions;$('adoptHistory').hidden=focused&&!shownAdoptions.length;if(!shownAdoptions.length&&!focused)$('adoptions').textContent=L.adoptEmpty;for(const r of shownAdoptions){const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=(r.action==='rollback'?L.revert:L.adopt)+' · '+(L[r.state]||r.state);section.append(h);text(section,L.source+' · '+r.source.evidence.revision.slice(0,12));if(r.action==='rollback')text(section,L.rollbackNote);if(r.state==='completed')text(section,L.loaded+' · '+r.loaded.bootCommit.slice(0,12));else if(r.commit)text(section,L.committed+' · '+r.commit.slice(0,12));if(r.reason||r.reloadError)pre(section,r.reason||r.reloadError);detail(section,L.before,r.before);detail(section,L.after,r.after);if(r.tests)detail(section,L.tests,JSON.stringify(r.tests,null,2));if(r.state==='awaiting_approval')button(section,L.adoptCancel,'cancel',()=>api({op:'cancel',id:r.id},'project-adoption'));if(r.state==='awaiting_restart')button(section,L.reload,'reload',()=>api({op:'reload',id:r.id},'project-adoption'));if(r.action==='adopt'&&r.state==='completed'&&!adoptions.some(a=>a.workRunId===r.workRunId&&a.action==='rollback'&&['completed','awaiting_restart'].includes(a.state)))button(section,L.revert,'rollback',()=>prepareAdoption(r.workRunId,'rollback'));detail(section,L.details,JSON.stringify({id:r.id,workRunId:r.workRunId,approvalHash:r.approvalHash,change:r.change,steps:r.steps,loaded:r.loaded},null,2));$('adoptions').append(section)}}
async function refresh(){if(refreshing)return;refreshing=true;try{if(focused){if(!validRun)throw Error(L.resultMissing);const selected=(await api(undefined,'project-work/'+encodeURIComponent(requestedRun))).run;if(!selected||selected.id!==requestedRun)throw Error(L.resultMissing);work=[selected]}else{work=(await api()).runs}adoptions=(await api(undefined,'project-adoption')).runs;active=work.some(r=>['queued','checking','coding','reviewing'].includes(r.state))||adoptions.some(r=>adoptionStates.has(r.state));render();if(approval&&!work.some(r=>r.id===approval.id&&r.state==='awaiting_approval')){approval=null;$('prepared').hidden=true}if(adoptionApproval&&!adoptions.some(r=>r.id===adoptionApproval.id&&r.state==='awaiting_approval')){adoptionApproval=null;$('adoptPrepared').hidden=true}if(focused)$('adoptPanel').hidden=!adoptionApproval;controls()}catch(e){$('message').textContent=L.error+' · '+e.message;if(focused){active=true;controls();document.querySelectorAll('[data-action]').forEach(b=>{b.disabled=true})}}finally{refreshing=false}}
refresh();setInterval(refresh,2500);
</script></body></html>
