<!doctype html><html lang="/*LOCALE*/"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imagine</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#24392f;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:32px auto;padding:0 24px}a{color:#3e6350}nav,.actions{display:flex;gap:18px;flex-wrap:wrap}.card{background:#fff;border:1px solid #dce3d9;border-radius:16px;padding:24px;margin:20px 0}h1{font-size:30px}h2{font-size:20px}button{border:0;border-radius:8px;padding:11px 18px;background:#365b46;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.45}label{display:block;margin:16px 0}textarea{display:block;width:100%;min-height:90px;font:inherit;border:1px solid #ccd7ca;border-radius:8px;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4ef;padding:14px;max-height:400px;overflow:auto;font-size:13px}summary{cursor:pointer}#message{min-height:26px}
</style></head><body><main><nav><a href="/demo">Imagine</a><a href="/project-work" id="workLink"></a><a id="login" href="/owner/login?next=%2Fproject-tasks" hidden></a></nav><h1 id="title"></h1><p id="intro"></p><section class="card"><label><span id="goalLabel"></span><textarea id="goal" maxlength="12000"></textarea></label><label><span id="criteriaLabel"></span><textarea id="criteria" maxlength="12000"></textarea></label><fieldset><legend id="scopeLabel"></legend></fieldset><p id="limits"></p><button id="start"></button><p id="message" role="status"></p></section><section class="card" id="detail" hidden></section><h2 id="history"></h2><button id="refresh"></button><div id="runs"></div></main><script>
'use strict';const L=/*LABELS*/,$=id=>document.getElementById(id);let posting=false,reading=false,selected=null,ticket=null,last='',formTask=null;
for(const id of ['title','intro','limits','start','history','refresh','login'])$(id).textContent=L[id];$('goalLabel').textContent=L.goal;$('criteriaLabel').textContent=L.criteria;$('scopeLabel').textContent=L.scope;$('workLink').textContent=L.work;document.title=L.title;
const profiles={context:['src/context/contextResult.js','src/context/toolGateway.js'],interface:['src/demo/assets/sidebar.js','src/demo/assets/sidebar.css'],chat:['src/demo/assets/index.html','src/demo/assets/app.js','src/demo/assets/app.css']};let scopeChecks=[];
const profileLabel=document.createElement('label'),profile=document.createElement('select');profileLabel.textContent=L.profile;for(const [value,label] of [['context',L.contextProfile],['interface',L.interfaceProfile],['chat',L.chatProfile],['repository',L.repositoryProfile]]){const o=document.createElement('option');o.value=value;o.textContent=label;profile.append(o)}profileLabel.append(profile);$('scopeLabel').parentNode.before(profileLabel);
const repositoryFields=document.createElement('div');for(const [id,labelText] of [['repositoryEditable',L.repositoryEditable],['repositoryReadonly',L.repositoryReadonly]]){const label=document.createElement('label');label.textContent=labelText;const input=document.createElement('textarea');input.id=id;input.maxLength=10000;label.append(input);repositoryFields.append(label)}$('scopeLabel').parentNode.after(repositoryFields);
const paths=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
function scope(){$('scopeLabel').parentNode.hidden=profile.value==='repository';repositoryFields.hidden=profile.value!=='repository';$('limits').textContent=profile.value==='repository'?L.repositoryLimits:L.limits;$('start').textContent=profile.value==='repository'?L.scopePrepare:L.start;const field=$('scopeLabel').parentNode;for(const n of [...field.querySelectorAll('label')])n.remove();scopeChecks=[];for(const file of (profiles[profile.value]||[])){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(file));field.append(label);scopeChecks.push({file,check})}}
profile.onchange=scope;scope();
async function api(body,id){const r=await fetch('/api/v1/project-tasks'+(id?'/'+encodeURIComponent(id):''),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(r.status===401){ticket=null;$('login').hidden=false;throw Error(L.login)}const v=await r.json();if(!r.ok||v.error)throw Error(v.error||L.uncertain);return v}
function text(parent,value,tag='p'){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e}
function detail(parent,label,value){const e=document.createElement('details');text(e,label,'summary');text(e,typeof value==='string'?value:JSON.stringify(value,null,2),'pre');parent.append(e)}
function button(parent,label,fn){const b=text(parent,label,'button');b.disabled=posting;b.onclick=async()=>{if(posting)return;posting=true;b.disabled=true;$('start').disabled=true;try{await fn()}catch(e){ticket=null;codingPanel=false;last='';$('message').textContent=L.uncertain+' · '+e.message}finally{posting=false;$('start').disabled=false;await refresh()}};return b}
function render(v){const r=v.run;if(!r)return;ticket=v.approval;const serial=JSON.stringify({r,ticket});if(last===serial)return;last=serial;$('detail').hidden=false;$('detail').replaceChildren();const box=$('detail');text(box,L[r.state]||r.state,'h2');text(box,r.input.goal);text(box,r.input.criteria.join('\n'),'pre');if(r.kind==='repository_repair'){text(box,L.repositoryLimits);if(r.input.editable.length)text(box,L.repositoryEditable+'\n'+r.input.editable.join('\n'),'pre');detail(box,L.source,{scope:r.scopeMaterial,usage:v.usage,nextAction:v.nextAction,workRunId:r.workRunId});if(formTask!==r.id){formTask=r.id;profile.value='repository';scope();$('goal').value=r.input.goal;$('criteria').value=r.input.criteria.join('\n');$('repositoryEditable').value=r.input.editable.join('\n');$('repositoryReadonly').value=(r.input.scope?.files||[]).filter(n=>!r.input.editable.includes(n)).join('\n')}button(box,L.inventory,async()=>{const data=await api({op:'inventory',id:r.id});detail(box,L.inventory,data.files)});} detail(box,L.source,{revision:r.input.bootCommit,editable:r.input.editable,readonly:r.registration?.workOrder.readonlyFiles,registrationHash:r.registration?.workOrder.registrationHash,approvalHash:r.approvalHash,expiresAt:r.expiresAt,steps:r.steps,reason:r.reason||null});if(r.generated)detail(box,L.tests,{expectedTests:r.generated.expectedTests,testCode:r.generated.testCode,executed:false});if(r.acceptanceReview)detail(box,L.review,r.acceptanceReview);
if(r.state==='awaiting_scope_approval'&&ticket){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(L.scopeConfirm));box.append(label);const b=button(box,L.scopeAuthorize,async()=>{const t=ticket;ticket=null;await api({op:'authorize',id:t.id,hash:t.hash,nonce:t.nonce});last=''});b.disabled=true;check.onchange=()=>{b.disabled=!check.checked||posting}}
if(['awaiting_approval','interrupted'].includes(r.state)&&r.generated&&r.acceptanceReview?.verdict==='pass'&&!r.workRunId)button(box,L.renew,async()=>{const renewed=await api({op:'renew',id:r.id});last='';render(renewed)});
if(r.state==='awaiting_approval'&&ticket){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(L.confirm));box.append(label);const b=button(box,L.approve,async()=>{const t=ticket;ticket=null;await api({op:'approve',id:t.id,hash:t.hash,nonce:t.nonce});last=''});b.disabled=true;check.onchange=()=>{b.disabled=!check.checked||posting}}
if(['queued','reading','drafting','reviewing','awaiting_approval'].includes(r.state))button(box,L.cancel,async()=>{ticket=null;await api({op:'cancel',id:r.id});last=''});
if(r.state==='registered'&&!r.preparation)button(box,L.prepare,async()=>{const v=await api({op:'prepare',id:r.id,requestId:crypto.randomUUID()});if(v.work?.approval){const w=v.work;detail(box,L.source,{workRunId:w.run.id,approvalHash:w.approval.hash,scope:w.run.workOrder});const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(L.confirm));box.append(label);const b=button(box,L.codingApprove,async()=>{const t=w.approval;w.approval=null;codingPanel=false;const res=await fetch('/api/v1/project-work',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'approve',id:t.id,hash:t.hash,nonce:t.nonce})});const value=await res.json();if(!res.ok||value.error)throw Error(value.error||L.uncertain);last=''});b.disabled=true;check.onchange=()=>{b.disabled=!check.checked||posting};selected=r.id;last=JSON.stringify({r:v.run,ticket:null});/* Keep the one-use coding ticket visible until action or reload. */codingPanel=true}else last=''});
if(r.workRunId){const a=text(box,L.work,'a');a.href='/project-work?run='+encodeURIComponent(r.workRunId)}
}
let codingPanel=false;
async function refresh(){if(reading||posting)return;reading=true;try{const v=await api();$('runs').replaceChildren();if(!v.runs.length)text($('runs'),L.empty);for(const r of v.runs){const box=document.createElement('section');box.className='card';text(box,(L[r.state]||r.state)+' · '+r.goal);button(box,L.refresh,async()=>{selected=r.id;ticket=null;last='';codingPanel=false});$('runs').append(box)}if(selected&&!codingPanel)render(await api(null,selected))}catch(e){$('message').textContent=e.message}finally{reading=false}}
$('start').onclick=async()=>{if(posting)return;const editable=profile.value==='repository'?paths('repositoryEditable'):scopeChecks.filter(v=>v.check.checked).map(v=>v.file);if(!editable.length){$('message').textContent=L.scope;return}posting=true;profile.disabled=true;$('start').disabled=true;ticket=null;try{let v;const criteria=$('criteria').value.split('\n').map(s=>s.trim()).filter(Boolean);if(profile.value==='repository'){v=await api({op:'request',requestId:crypto.randomUUID(),goal:$('goal').value});selected=v.run.id;if(v.run.kind==='repository_repair'&&['awaiting_scope','awaiting_scope_approval'].includes(v.run.state))v=await api({op:'scope',id:selected,criteria,editable,readonly:paths('repositoryReadonly')})}else{v=await api({op:'start',requestId:crypto.randomUUID(),goal:$('goal').value,criteria,editable});selected=v.run.id;}last='';codingPanel=false}catch(e){$('message').textContent=L.uncertain+' · '+e.message}finally{posting=false;profile.disabled=false;$('start').disabled=false;await refresh()}};
$('refresh').onclick=()=>{ticket=null;last='';codingPanel=false;refresh()};selected=new URLSearchParams(location.search).get('task');refresh();setInterval(refresh,2500);
</script></body></html>
