<!doctype html><html lang="/*LOCALE*/"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiangxiang</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#24392f;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:32px auto;padding:0 24px}a{color:#3e6350}nav,.actions{display:flex;gap:18px;flex-wrap:wrap}.card{background:#fff;border:1px solid #dce3d9;border-radius:16px;padding:24px;margin:20px 0}h1{font-size:30px}h2{font-size:20px}button{border:0;border-radius:8px;padding:11px 18px;background:#365b46;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.45}label{display:block;margin:16px 0}textarea{display:block;width:100%;min-height:90px;font:inherit;border:1px solid #ccd7ca;border-radius:8px;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f4ef;padding:14px;max-height:400px;overflow:auto;font-size:13px}summary{cursor:pointer}#message{min-height:26px}
</style></head><body><main><nav><a href="/demo">Xiangxiang</a><a href="/project-work" id="workLink"></a><a id="login" href="/owner/login?next=%2Fproject-tasks" hidden></a></nav><h1 id="title"></h1><p id="intro"></p><section class="card"><label><span id="goalLabel"></span><textarea id="goal" maxlength="3000"></textarea></label><label><span id="criteriaLabel"></span><textarea id="criteria" maxlength="12000"></textarea></label><fieldset><legend id="scopeLabel"></legend><label><input id="gateway" type="checkbox" checked> src/context/toolGateway.js</label><label><input id="context" type="checkbox"> src/context/contextResult.js</label></fieldset><p id="limits"></p><button id="start"></button><p id="message" role="status"></p></section><section class="card" id="detail" hidden></section><h2 id="history"></h2><button id="refresh"></button><div id="runs"></div></main><script>
'use strict';const L=/*LABELS*/,$=id=>document.getElementById(id);let posting=false,reading=false,selected=null,ticket=null,last='';
for(const id of ['title','intro','limits','start','history','refresh','login'])$(id).textContent=L[id];$('goalLabel').textContent=L.goal;$('criteriaLabel').textContent=L.criteria;$('scopeLabel').textContent=L.scope;$('workLink').textContent=L.work;document.title=L.title;
async function api(body,id){const r=await fetch('/api/v1/project-tasks'+(id?'/'+encodeURIComponent(id):''),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(r.status===401){ticket=null;$('login').hidden=false;throw Error(L.login)}const v=await r.json();if(!r.ok||v.error)throw Error(v.error||L.uncertain);return v}
function text(parent,value,tag='p'){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e}
function detail(parent,label,value){const e=document.createElement('details');text(e,label,'summary');text(e,typeof value==='string'?value:JSON.stringify(value,null,2),'pre');parent.append(e)}
function button(parent,label,fn){const b=text(parent,label,'button');b.disabled=posting;b.onclick=async()=>{if(posting)return;posting=true;b.disabled=true;$('start').disabled=true;try{await fn()}catch(e){ticket=null;codingPanel=false;last='';$('message').textContent=L.uncertain+' · '+e.message}finally{posting=false;$('start').disabled=false;await refresh()}};return b}
function render(v){const r=v.run;if(!r)return;ticket=v.approval;const serial=JSON.stringify({r,ticket});if(last===serial)return;last=serial;$('detail').hidden=false;$('detail').replaceChildren();const box=$('detail');text(box,L[r.state]||r.state,'h2');text(box,r.input.goal);text(box,r.input.criteria.join('\n'),'pre');detail(box,L.source,{revision:r.input.bootCommit,editable:r.input.editable,readonly:r.registration?.workOrder.readonlyFiles,registrationHash:r.registration?.workOrder.registrationHash,approvalHash:r.approvalHash,expiresAt:r.expiresAt,steps:r.steps,reason:r.reason||null});if(r.generated)detail(box,L.tests,{expectedTests:r.generated.expectedTests,testCode:r.generated.testCode,executed:false});if(r.acceptanceReview)detail(box,L.review,r.acceptanceReview);
if(r.state==='awaiting_approval'&&ticket){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(L.confirm));box.append(label);const b=button(box,L.approve,async()=>{const t=ticket;ticket=null;await api({op:'approve',id:t.id,hash:t.hash,nonce:t.nonce});last=''});b.disabled=true;check.onchange=()=>{b.disabled=!check.checked||posting}}
if(['queued','reading','drafting','reviewing','awaiting_approval'].includes(r.state))button(box,L.cancel,async()=>{ticket=null;await api({op:'cancel',id:r.id});last=''});
if(r.state==='registered'&&!r.preparation)button(box,L.prepare,async()=>{const v=await api({op:'prepare',id:r.id,requestId:crypto.randomUUID()});if(v.work?.approval){const w=v.work;detail(box,L.source,{workRunId:w.run.id,approvalHash:w.approval.hash,scope:w.run.workOrder});const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(L.confirm));box.append(label);const b=button(box,L.codingApprove,async()=>{const t=w.approval;w.approval=null;codingPanel=false;const res=await fetch('/api/v1/project-work',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'approve',id:t.id,hash:t.hash,nonce:t.nonce})});const value=await res.json();if(!res.ok||value.error)throw Error(value.error||L.uncertain);last=''});b.disabled=true;check.onchange=()=>{b.disabled=!check.checked||posting};selected=r.id;last=JSON.stringify({r:v.run,ticket:null});/* Keep the one-use coding ticket visible until action or reload. */codingPanel=true}else last=''});
if(r.workRunId){const a=text(box,L.work,'a');a.href='/project-work?run='+encodeURIComponent(r.workRunId)}
}
let codingPanel=false;
async function refresh(){if(reading||posting)return;reading=true;try{const v=await api();$('runs').replaceChildren();if(!v.runs.length)text($('runs'),L.empty);for(const r of v.runs){const box=document.createElement('section');box.className='card';text(box,(L[r.state]||r.state)+' · '+r.goal);button(box,L.refresh,async()=>{selected=r.id;ticket=null;last='';codingPanel=false});$('runs').append(box)}if(selected&&!codingPanel)render(await api(null,selected))}catch(e){$('message').textContent=e.message}finally{reading=false}}
$('start').onclick=async()=>{if(posting)return;posting=true;$('start').disabled=true;ticket=null;try{const editable=[];if($('context').checked)editable.push('src/context/contextResult.js');if($('gateway').checked)editable.push('src/context/toolGateway.js');const v=await api({op:'start',requestId:crypto.randomUUID(),goal:$('goal').value,criteria:$('criteria').value.split('\n').map(s=>s.trim()).filter(Boolean),editable});selected=v.run.id;last='';codingPanel=false}catch(e){$('message').textContent=L.uncertain+' · '+e.message}finally{posting=false;$('start').disabled=false;await refresh()}};
$('refresh').onclick=()=>{ticket=null;last='';codingPanel=false;refresh()};selected=new URLSearchParams(location.search).get('task');refresh();setInterval(refresh,2500);
</script></body></html>
