<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Development Proposal · Xiangxiang</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#26332c;font:16px/1.65 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:28px 22px 64px}nav,.actions{display:flex;gap:14px;flex-wrap:wrap}a{color:#285f48}h1{font-size:30px;margin:24px 0 12px}h2{font-size:19px}p{overflow-wrap:anywhere}.muted{color:#64736b}.card{margin-top:20px;background:#fffefa;border:1px solid #dce4dc;border-radius:12px;padding:20px}button{background:#fff;color:#285f48;border:1px solid #bacabd;border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:default}details{margin-top:18px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace}.note{border-left:4px solid #b38a45;padding-left:14px}#status{font-weight:650}li{margin:8px 0}button:focus-visible,a:focus-visible{outline:3px solid #b38a45;outline-offset:3px}
</style></head><body><main><nav><a href="/demo" id="back"></a><a href="/architecture" id="architecture"></a></nav><h1 id="title"></h1><p id="intro" class="muted"></p><p id="scope" class="note"></p><div class="actions"><button id="start" type="button"></button><button id="cancel" type="button" hidden></button><button id="refresh" type="button"></button></div><p id="status" role="status" aria-live="polite"></p><section id="result" class="card" hidden></section><section class="card"><h2 id="historyLabel"></h2><div id="history"></div></section></main><script>
'use strict';const L=/*LABELS*/{},el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};const API=L.api;let current=null,timer=null,requestId=null,busy=false;
for(const id of ['back','architecture','title','intro','scope','start','cancel','refresh'])el(id).textContent=L[id];el('historyLabel').textContent=L.history;el('status').textContent=L.idle;document.title=L.title+' · Xiangxiang';
const other=node('a',L.other);other.href=L.otherPage;document.querySelector('nav').append(other);
async function request(url,body){const res=await fetch(url,{method:body?'POST':'GET',cache:'no-store',headers:body?{'content-type':'application/json'}:{},...(body?{body:JSON.stringify(body)}:{})});const value=await res.json();if(!res.ok)throw Error(value.error||'unavailable');return value}
function draw(r){current=r.id;el('status').textContent=(L[r.state]||L.error)+(r.reason?' · '+(r.reason==='subscription_limit_reached'?L.quota:r.reason==='subscription_login_required'?L.login:r.reason==='evidence_changed'?L.changed:L.error):'');const active=['queued','running'].includes(r.state);el('start').disabled=active;el('cancel').hidden=!active;el('result').hidden=false;el('result').replaceChildren();
if(r.result&&!L.diagnosis){el('result').append(node('h2',L.proposal),node('p',r.result.nextStep),node('p',r.result.rationale));el('result').append(node('h2',L.checks));const list=node('ul','');r.result.acceptanceChecks.forEach(c=>list.append(node('li',c)));el('result').append(list);if(r.result.questions.length){el('result').append(node('h2',L.questions));const q=node('ul','');r.result.questions.forEach(c=>q.append(node('li',c)));el('result').append(q)}}
if(L.diagnosis){if(r.workOrder.worker)el('result').append(node('p',L.worker+' · '+r.workOrder.worker+' · '+r.workOrder.model));if(r.result){el('result').append(node('h2',L.proposal),node('p',r.result.summary));if(!r.result.findings.length)el('result').append(node('p',L.noFindings));r.result.findings.forEach(f=>{el('result').append(node('h2',f.title+' · '+f.severity),node('p',f.reason),node('p',f.proposedFix));f.citations.forEach(c=>{const file=r.evidence.files.find(x=>x.evidenceId===c.evidenceId);el('result').append(node('p',L.quote+' · '+file.path+':'+c.startLine+'–'+c.endLine),node('pre',c.quote))});el('result').append(node('h2',L.checks));const checks=node('ul','');f.validationPlan.forEach(s=>checks.append(node('li',s)));el('result').append(checks)});el('result').append(node('h2',L.limitations));const limits=node('ul','');r.result.limitations.forEach(s=>limits.append(node('li',s)));el('result').append(limits)}}
if(r.verification)el('result').append(node('p',r.verification.matched?L.verified:L.changed));if(r.memoryReceipt)el('result').append(node('p',L.memory+' · '+r.memoryReceipt));const details=node('details','');details.append(node('summary',L.evidence+' / '+L.timeline));details.append(node('pre',JSON.stringify({id:r.id,workOrder:r.workOrder,evidence:r.evidence,retrievedAt:r.retrievedAt,verification:r.verification,steps:r.steps},null,2)));el('result').append(details);history.replaceState(null,'',L.page+'?run='+encodeURIComponent(r.id));clearTimeout(timer);if(active)timer=setTimeout(poll,3000)}
async function poll(){try{const v=await request(API+'/'+encodeURIComponent(current));if(!v.run)throw Error();draw(v.run)}catch(_){el('status').textContent=L.error;clearTimeout(timer);el('refresh').disabled=false}}
async function listing(){const v=await request(API);el('history').replaceChildren();if(L.diagnosis&&v.workers)el('history').append(node('p',L.configured+' · '+v.workers.map(w=>w.name+' / '+w.model).join(', ')));v.runs.forEach(r=>{const line=node('p',''),link=node('a',(r.startedAt||r.id)+' · '+(L[r.state]||r.state));link.href=L.page+'?run='+encodeURIComponent(r.id);line.append(link);el('history').append(line)})}
el('start').onclick=async()=>{if(busy)return;busy=true;el('start').disabled=true;el('status').textContent=L.loading;requestId=requestId||crypto.randomUUID();try{const v=await request(API,{op:'start',requestId});requestId=null;draw(v.run);await listing()}catch(_){el('status').textContent=L.error;el('start').disabled=false}finally{busy=false}};
el('cancel').onclick=async()=>{if(busy||!current)return;busy=true;try{const v=await request(API,{op:'cancel',id:current});draw(v.run);await listing()}catch(_){el('status').textContent=L.error}finally{busy=false}};
el('refresh').onclick=async()=>{try{if(current)await poll();await listing()}catch(_){el('status').textContent=L.error}};
const id=new URLSearchParams(location.search).get('run');if(/^[a-f0-9-]{36}$/i.test(id||'')){current=id;poll()}listing().catch(()=>{el('status').textContent=L.error});
</script></body></html>
