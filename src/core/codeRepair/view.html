<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiangxiang</title><style>
:root{font-family:system-ui,sans-serif;color:#26352e;background:#f6f5ef}body{margin:0}main{max-width:980px;margin:auto;padding:28px 22px 70px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#426855}h1{font-size:29px}p{line-height:1.65}.muted{color:#617067}.card{background:#fff;border:1px solid #d4dbd1;border-radius:14px;padding:20px;margin:18px 0}.note{border-left:4px solid #b58a45;padding:12px 16px;background:#fffcf4}button,select{font:inherit;padding:10px 14px;border:1px solid #bfcbbf;border-radius:8px;background:#fff;color:#365844}button:disabled{opacity:.5}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #b58a45;outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin-top:16px}h2{font-size:19px}label{display:block;margin:16px 0}small{overflow-wrap:anywhere}li{margin:7px 0}</style></head><body><main>
<nav><a id="back" href="/code-diagnosis"></a><a id="architecture" href="/architecture"></a></nav><h1 id="title"></h1><p id="intro" class="muted"></p><p id="scope" class="note"></p><select id="diagnosis" aria-label="Diagnosis"></select><div class="actions"><button id="prepare"></button><button id="cancel" hidden></button></div><p id="status" role="status" aria-live="polite"></p><section id="result" class="card" hidden></section><section class="card"><h2 id="historyTitle"></h2><div id="historyList"></div></section>
<script>'use strict';const L=/*LABELS*/{},el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};let current=null,busy=false,timer;
for(const id of ['title','intro','scope','prepare','cancel','back','architecture'])el(id).textContent=L[id];document.title=L.title+' · Xiangxiang';el('status').textContent=L.idle;el('historyTitle').textContent=L.history;
async function request(input,id){const response=await fetch('/api/v1/code-repair'+(id?'/'+encodeURIComponent(id):''),{method:input?'POST':'GET',cache:'no-store',...(input?{headers:{'content-type':'application/json'},body:JSON.stringify(input)}:{})});const v=await response.json();if(!response.ok||v.error)throw Error(v.error||'workflow_unavailable');return v}
function measurements(title,value){el('result').append(node('h2',title),node('p','tests '+value.tests+' · pass '+value.pass+' · fail '+value.fail+' · skipped '+value.skipped));const d=node('details','');d.append(node('summary',title));d.append(node('pre',value.stdout));el('result').append(d)}
function draw(r){current=r.id;clearTimeout(timer);const active=['checking','running'].includes(r.state);el('prepare').disabled=active;el('cancel').hidden=!active&&r.state!=='awaiting_approval';el('status').textContent=(L[r.state]||L.error)+(r.reason?' · '+r.reason:'');el('result').hidden=false;el('result').replaceChildren();el('result').append(node('p',r.workOrder.model+' · '+r.id));
if(r.source)el('result').append(node('small','Source '+r.source.revision+' · Runtime '+r.source.headCommit));if(r.baseline)measurements(L.baseline,r.baseline);
if(r.plan){el('result').append(node('h2',L.plan));const ul=node('ul','');r.plan.forEach(p=>{const li=node('li',p.title);li.append(node('pre',p.files.join('\n')),node('p',p.effect));ul.append(li)});el('result').append(ul)}
if(r.state==='awaiting_approval'){el('result').append(node('p',L.approval),node('small',r.approval.hash+' · '+r.approval.expiresAt));const b=node('button',L.approve);b.type='button';b.onclick=async()=>{if(busy)return;busy=true;b.disabled=true;try{draw((await request({op:'approve',id:r.id,hash:r.approval.hash,nonce:r.approval.nonce})).run)}catch(e){el('status').textContent=L.error+' · '+e.message}finally{busy=false}};el('result').append(b)}
if(r.tests)measurements(L.tests,r.tests);if(r.result){el('result').append(node('h2',L.patch),node('p',r.result.summary));for(const f of r.result.changes){const d=node('details','');d.append(node('summary',f.path+' · '+f.beforeHash.slice(0,12)+' → '+f.afterHash.slice(0,12)));d.append(node('pre',JSON.stringify({before:f.before,after:f.after},null,2)));el('result').append(d)}}
el('result').append(node('p',L.limits));if(r.memoryReceipt)el('result').append(node('p',L.receipt+' · '+r.memoryReceipt));const audit=node('details','');audit.append(node('summary',L.history),node('pre',JSON.stringify({approval:r.approval?{hash:r.approval.hash,consumed:r.approval.consumed,actor:r.approval.actor,decidedAt:r.approval.decidedAt}:null,steps:r.steps,patchHash:r.result?.patchHash},null,2)));el('result').append(audit);history.replaceState(null,'','/code-repair?run='+encodeURIComponent(r.id));if(active)timer=setTimeout(poll,2000)}
async function poll(){try{draw((await request(null,current)).run)}catch(e){el('status').textContent=L.error+' · '+e.message}}
el('prepare').onclick=async()=>{if(busy||!el('diagnosis').value)return;busy=true;el('prepare').disabled=true;try{draw((await request({op:'prepare',diagnosisId:el('diagnosis').value,requestId:crypto.randomUUID()})).run)}catch(e){el('status').textContent=L.error+' · '+e.message;el('prepare').disabled=false}finally{busy=false}};
el('cancel').onclick=async()=>{if(!current)return;try{draw((await request({op:'cancel',id:current})).run)}catch(e){el('status').textContent=L.error+' · '+e.message}};
(async()=>{try{const diagnoses=await (await fetch('/api/v1/code-diagnosis',{cache:'no-store'})).json();for(const r of diagnoses.runs||[]){if(r.state!=='completed')continue;const o=node('option',r.startedAt+' · '+r.id);o.value=r.id;el('diagnosis').append(o)}const v=await request();for(const r of v.runs){const a=node('a',r.startedAt+' · '+(L[r.state]||r.state));a.href='/code-repair?run='+r.id;const p=node('p','');p.append(a);el('historyList').append(p)}const id=new URLSearchParams(location.search).get('run');if(id){current=id;await poll()}}catch(e){el('status').textContent=L.error+' · '+e.message}})();
</script></main></body></html>
