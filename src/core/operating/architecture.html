<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · Xiangxiang</title>
<style>
:root{color-scheme:light;--ink:#26332c;--muted:#64736b;--line:#dce4dc;--paper:#fffefa;--green:#285f48}*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:var(--ink);font:16px/1.65 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:30px 26px 70px}nav{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}a{color:var(--green)}h1{font-size:34px;line-height:1.25;margin:24px 0 12px}h2{font-size:19px;margin:0}p{margin:8px 0}.intro{max-width:850px;color:var(--muted)}.snapshot{font-size:13px;color:var(--muted);border-left:3px solid #b7c8b9;padding-left:12px;margin:18px 0}.flow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:24px 0}.flow li{background:#e7eee4;border:1px solid var(--line);padding:8px 15px;border-radius:8px}.flow li+li:before{content:'→';margin-right:14px;color:var(--muted)}.priority{background:#e9f1e8;border:1px solid #c5d9c3;border-radius:12px;padding:20px 24px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}.card-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{font-size:12px;white-space:nowrap;padding:3px 9px;border-radius:20px;background:#f4ebd7;color:#81551e}.badge.foundation{background:#e5efdf;color:#315739}.purpose{color:var(--muted);font-size:14px}dl{font-size:14px;margin-bottom:0}dt{font-weight:650;margin-top:12px}dd{margin:2px 0 0}details{margin-top:18px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}summary{cursor:pointer}code{display:block;margin-top:8px;overflow-wrap:anywhere}section.lower{margin-top:20px}ul{padding-left:22px}.boundary{border-left:4px solid #b38a45}a:focus-visible,summary:focus-visible{outline:3px solid #b38a45;outline-offset:4px}@media(max-width:720px){main{padding:20px 16px 45px}.grid{grid-template-columns:1fr}h1{font-size:28px}.card-heading{align-items:flex-start}.flow{font-size:13px;gap:6px}.flow li{padding:6px 9px}}
</style></head><body><main>
<nav><a href="/demo">{{back}}</a><a href="/manager">{{briefing}}</a></nav>
<header><h1>{{title}}</h1><p class="intro">{{intro}}</p><p class="snapshot">{{snapshot}}</p></header>
<ol class="flow" aria-label="{{flow}}"><li>{{owner}}</li><li>{{core}}</li><li>{{tools}}</li><li>{{result}}</li><li>{{memory}}</li></ol>
<section class="priority"><h2>{{priority}}</h2><p>{{priorityText}}</p></section>
<section class="grid"><!--CARDS--></section>
<section class="card lower"><h2>{{roles}}</h2><p>{{rolesText}}</p></section>
<section class="card lower"><h2>{{integrations}}</h2><ul><!--INTEGRATIONS--></ul></section>
<section class="card lower boundary"><h2>{{boundary}}</h2><p>{{boundaryText}}</p></section>
</main></body></html>
