<!doctype html><html lang="/*LOCALE*/"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiangxiang</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#24392f;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:32px auto;padding:0 24px}nav{display:flex;gap:24px}a{color:#3e6350}h1{font-size:30px;margin-bottom:8px}h2{font-size:20px}p{margin:10px 0}.card{background:#fff;border:1px solid #dce3d9;border-radius:16px;padding:24px;margin:20px 0}.muted{color:#69766c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.provider{padding:14px;border:1px solid #dde5db;border-radius:10px}button{border:0;border-radius:8px;padding:11px 18px;background:#365b46;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.secondary{background:#e9eee6;color:#284331}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:block;margin:16px 0}.badge{background:#edf1e8;border-radius:6px;padding:3px 9px;margin-left:12px;font-size:14px}.failed,.needs_attention,.interrupted{background:#f8e6cf;color:#74491e}.completed{background:#dff1df;color:#23532c}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#f2f4ef;border-radius:8px;font-size:13px;max-height:400px;overflow:auto}details{margin:12px 0}summary{cursor:pointer}#message{min-height:26px}ol{padding-left:24px}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:0 14px}.card{padding:18px}}
</style></head><body><main>
<nav><a href="/demo" id="back"></a><a href="/architecture" id="architecture"></a></nav>
<h1 id="title"></h1><p id="intro"></p>
<section class="card"><h2 id="projectTitle"></h2><p id="projectIntro"></p><a href="/project-work" id="projectLink"></a></section>
<section class="card"><h2 id="isolationTitle"></h2><p id="isolationState" role="status"></p><p id="isolationNotice" class="muted"></p></section>
<section class="card"><div class="grid"><div class="provider"><b>06 · OpenAI / GPT</b><p id="gptState"></p></div><div class="provider"><b>07 · Codex</b><p id="codexState"></p></div><div class="provider"><b>08 · Claude</b><p id="claudeState"></p></div></div><p class="muted" id="billing"></p><button id="check" class="secondary"></button></section>
<section class="card"><h2 id="workOrder"></h2><p id="goal"></p><p class="muted" id="scope"></p><label><input id="approve" type="checkbox"> <span id="approval"></span></label><div class="actions"><button id="run" disabled></button><span id="timer" class="muted"></span></div><p id="message" role="status"></p></section>
<h2 id="history"></h2><div id="runs"></div>
</main><script>
'use strict'; const L=/*LABELS*/; const $=id=>document.getElementById(id); let enabled=false,busy=false,posting=false,lastRender='',isolationReady=false;
for(const id of ['title','intro','back','architecture','billing','check','workOrder','goal','scope','approval','run','history']) $(id).textContent=L[id]; document.title=L.title;
for(const id of ['projectTitle','projectIntro','projectLink'])$(id).textContent=L[id];
for(const id of ['gptState','codexState','claudeState'])$(id).textContent=L.unknown;
$('isolationTitle').textContent=L.isolation;$('isolationNotice').textContent=L.isolationNotice;$('isolationState').textContent=L.isolationPending;
const isolationReasons={windows_restart_required:L.isolationRestart,windows_sandbox_cli_unavailable:L.isolationCli,windows_virtualization_unavailable:L.isolationVirtualization,sandbox_recovery_or_work_pending:L.isolationRecovery};
function controls(){ $('run').disabled=!enabled||!isolationReady||busy||posting||!$('approve').checked }
$('approve').onchange=controls;
async function request(body){const r=await fetch('/api/v1/worker-flow',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const v=await r.json();if(!r.ok||v.error)throw Error(v.error||'worker_unavailable');return v}
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n}
function detail(parent,title,text){const d=el('details');d.append(el('summary',title),el('pre',text));parent.append(d)}
function render(runs){const signature=JSON.stringify({runs,enabled,posting});if(signature===lastRender){controls();return;}lastRender=signature;$('runs').replaceChildren();busy=runs.some(r=>['queued','checking','coding','reviewing'].includes(r.state));if(!runs.length)$('runs').append(el('p',L.empty));
for(const r of runs){const c=el('section',null,'card');const h=el('h2',new Date(r.createdAt).toLocaleString());h.append(el('span',L[r.state]||r.state,'badge '+r.state));c.append(h);
if(r.error)c.append(el('p',L.failed+' · '+r.error));
if(r.coding&&['failed','needs_attention','interrupted'].includes(r.state)){const retry=el('button',L.retry,'secondary');retry.disabled=busy||posting||!enabled;retry.onclick=async()=>{posting=true;retry.disabled=true;controls();try{await request({op:'review',id:r.id,approved:true});await refresh();}catch(e){$('message').textContent=L.failed+' · '+e.message;}finally{posting=false;controls();}};c.append(retry);}
if(r.coding){c.append(el('p','Codex · '+(r.coding.model||L.unknown)));c.append(el('p',L.tests+' · '+(r.coding.tests.total!=null?r.coding.tests.passed+'/'+r.coding.tests.total+' '+L.testCount:'exit '+r.coding.tests.exitCode)));detail(c,L.before,r.coding.before);detail(c,L.after,r.coding.after);detail(c,L.tests,r.coding.tests.stdout+'\n'+r.coding.tests.stderr);}
if(r.review){c.append(el('h3',L.review+' · '+(r.review.model||L.unknown)),el('p',r.review.summary));for(const f of r.review.findings)c.append(el('p',f.file+':'+f.line+' — '+f.message));}
const events=el('ol');for(const e of r.events)events.append(el('li',new Date(e.at).toLocaleTimeString()+' · '+(L[e.stage]||e.stage)+(e.exitCode!=null?' · exit '+e.exitCode:'')));const d=el('details');d.append(el('summary',L.evidence),events);c.append(d);detail(c,L.details,JSON.stringify({id:r.id,workOrder:r.workOrder,providers:r.providers},null,2));$('runs').append(c);
} controls();}
async function refresh(){try{const v=await request();enabled=v.enabled;isolationReady=v.isolation?.ready===true;$('isolationState').textContent=(isolationReady?L.isolationReady:L.isolationPending)+(v.isolation?.reason?' · '+(isolationReasons[v.isolation.reason]||L.unavailable):'');render(v.runs);if(!enabled)$('message').textContent=L.disabled;const active=v.runs.find(r=>['queued','checking','coding','reviewing'].includes(r.state));$('timer').textContent=active?L.elapsed+' '+Math.floor((Date.now()-Date.parse(active.createdAt))/1000)+'s':'';}catch(e){$('message').textContent=L.unavailable;enabled=false;isolationReady=false;controls();}}
$('check').onclick=async()=>{$('check').disabled=true;try{const v=await request({op:'status'});enabled=v.enabled;const s=p=>p?.ready?L.ready+' · '+(p.model||p.billing):L.unavailable+' · '+(p?.error||L.unknown);$('gptState').textContent=s(v.providers.codex);$('codexState').textContent=s(v.providers.codex);$('claudeState').textContent=s(v.providers.claude);}catch(e){$('message').textContent=L.unavailable;}finally{$('check').disabled=false;controls();}};
$('run').onclick=async()=>{posting=true;controls();$('message').textContent=L.queued;try{await request({op:'start',recipe:'duration-v1',approved:$('approve').checked});$('approve').checked=false;await refresh();$('message').textContent='';}catch(e){$('message').textContent=L.failed+' · '+e.message;}finally{posting=false;controls();}};
refresh();setInterval(refresh,2500);
</script></body></html>
