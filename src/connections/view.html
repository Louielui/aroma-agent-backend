<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connections</title>
<style>
:root{color-scheme:light dark;--bg:#faf9f7;--card:#fff;--ink:#252525;--soft:#696762;--line:#e4e0d9;--badge:#eeeae2;--green:#24663b}*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0}main{max-width:1100px;margin:30px auto;padding:24px}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:30px;letter-spacing:-.03em;margin:26px 0 10px}h2{font-size:20px;margin:0}p{line-height:1.7;color:var(--soft)}.google{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:26px 0 20px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:9px 15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}button:hover{background:var(--badge)}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--ink);color:var(--card)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:16px}.badge{align-self:flex-start;border-radius:20px;padding:5px 10px;background:var(--badge);font-size:12px}.badge.connected{color:var(--green)}article p{margin:0;min-height:80px}dl{margin:0;font-size:13px}dt{color:var(--soft);margin-top:12px}dd{margin:4px 0;overflow-wrap:anywhere}article .actions{margin-top:auto}details{font-size:12px;color:var(--soft)}summary{cursor:pointer}ul{padding-left:18px;overflow-wrap:anywhere}#notice{min-height:24px}footer{margin-top:24px;font-size:13px;color:var(--soft)}@media(max-width:850px){.grid{grid-template-columns:1fr}article p{min-height:0}}@media(prefers-color-scheme:dark){:root{--bg:#1b1b1a;--card:#262625;--ink:#ececea;--soft:#b4b2ac;--line:#3b3b38;--badge:#373732;--green:#a0d6ad}}
</style>
<main><a id="back" href="/demo"></a><h1 id="title"></h1><p id="intro"></p><section class="google"><header><h2 id="google"></h2><div class="actions"><button id="authorize" type="button" class="primary"></button><a id="manage" href="https://myaccount.google.com/connections" target="_blank" rel="noopener noreferrer"></a></div></header><p id="auth-note"></p><p id="master"></p></section><p id="notice" role="status" aria-live="polite"></p><div id="cards" class="grid"></div><footer id="scope-note"></footer></main>
<script>
'use strict';const L=/*LABELS*/;const el=id=>document.getElementById(id);let pending=false;let canAuthorize=false
for(const [id,key] of [['back','back'],['title','title'],['intro','intro'],['google','google'],['authorize','auth'],['manage','manage'],['auth-note','authNote'],['scope-note','scopeNote']])el(id).textContent=L[key]
document.title=L.title
const names={gmail:'Gmail',drive:'Google Drive',calendar:'Google Calendar'}
const states={connected:L.connected,unverified:L.unverified,stale:L.stale,disabled:L.disabled,auth:L.authorization,permission:L.permission,configuration:L.configuration,timeout:L.timeout,error:L.failed}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function lock(value){pending=value;document.querySelectorAll('button').forEach(b=>b.disabled=value);el('authorize').disabled=value||!canAuthorize}
function date(value){return value?new Date(value).toLocaleString():L.unknown}
async function load(){
 try{const r=await fetch('/api/v1/connections',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();canAuthorize=data.canAuthorize;el('authorize').disabled=pending||!canAuthorize;el('master').textContent=!data.masterEnabled?L.masterOff:!canAuthorize?L.authMissing:'';el('cards').replaceChildren()
 for(const row of data.connections){const card=node('article');card.append(node('h2',names[row.source]),node('span',states[row.state]||L.failed,'badge '+row.state),node('p',L[row.source]));const dl=node('dl');const add=(label,value)=>dl.append(node('dt',label),node('dd',value));add(L.account,row.account||L.unknown);add(L.checked,date(row.lastProbe&&row.lastProbe.at));add(L.success,date(row.lastSuccessAt));if(row.lastProbe&&row.lastProbe.count!==null)add(L.count,String(row.lastProbe.count));card.append(dl)
 const details=node('details');details.append(node('summary',L.scopes));if(row.scopes){const list=node('ul');for(const s of row.scopes)list.append(node('li',s));details.append(list)}else details.append(node('p',L.unknown));card.append(details)
 const actions=node('div',undefined,'actions');const test=node('button',L.test);test.type='button';test.disabled=!row.enabled||pending;test.onclick=()=>act({op:'test',source:row.source});const toggle=node('button',row.sourceEnabled?L.disable:L.enable);toggle.type='button';toggle.disabled=pending;toggle.onclick=()=>act({op:'toggle',source:row.source,enabled:!row.sourceEnabled});actions.append(test,toggle);card.append(actions);el('cards').append(card)}
 }catch(_){el('notice').textContent=L.error;el('cards').replaceChildren();canAuthorize=false;el('authorize').disabled=true}
}
async function act(body){if(pending)return;lock(true);el('notice').textContent=L.loading;try{const r=await fetch('/api/v1/connections',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error();const data=await r.json();if(body.op==='authorize'){const url=new URL(data.url);if(url.origin!=='https://accounts.google.com')throw Error();window.location.assign(url.href);return}el('notice').textContent=''}catch(_){el('notice').textContent=L.error}finally{pending=false;await load()}}
el('authorize').onclick=()=>act({op:'authorize'})
const result=new URLSearchParams(window.location.search).get('authorization');if(result)el('notice').textContent=result==='success'?L.authSuccess:L.authFailed
load();setInterval(()=>{if(!pending)load()},60000)
</script></html>
